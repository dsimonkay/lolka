    this.titleCard(ch);
  },
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; clearInterval(this.typer); this.typing = false; },
  after(fn, ms) { this.timers.push(setTimeout(() => { if (UI.current === 'scr-story') fn(); }, ms)); },
  titleCard(ch) {
    const ov = $('#sOverlay');
    ov.innerHTML = '<div class="chcard"><small>Chapter ' + (S.chapter + 1) + '</small><h2>' + esc(ch.title) + '</h2></div>';
    this.waiting = 'card';
    Sound.play('sparkle');
    this.after(() => { if (this.waiting === 'card') this.closeCard(); }, 2000);
  },
  closeCard() { $('#sOverlay').innerHTML = ''; this.waiting = null; this.next(); },
  setBg(kind) { const b = $('#sBg'); b.className = 'sbg bg-' + kind; b.innerHTML = BG_DECOR[kind] || ''; },
  next() {
    const st = this.queue.shift();
    if (!st) { this.complete(); return; }
    if (st.s) this.say(st);
    else if (st.choice) this.choice(st);
    else if (st.tierChoice) this.tierChoice();
    else if (st.input) this.input();
    else if (st.game) this.game(st);
    else if (st.recruit) this.recruit(st.recruit);
    else if (st.unlock) { if (S.games.indexOf(st.unlock) < 0) S.games.push(st.unlock); Store.save(); this.next(); }
    else if (st.reward) this.reward(st.reward);
    else if (st.bg) { this.setBg(st.bg); Sound.play('whoosh'); this.cast = []; this.renderCast(); this.after(() => this.next(), 450); }
    else if (st.fx) this.fx(st.fx);
    else this.next();
  },
  enter(id, mood) {
    let a = null;
    this.cast.forEach(c => { if (c.id === id) a = c; });
    if (!a) {
      if (this.cast.length >= 3) {
        let old = 0;
        this.cast.forEach((c, i) => { if (c.t < this.cast[old].t) old = i; });
        this.cast.splice(old, 1);
      }
      a = { id, fresh: true, t: 0 };
      this.cast.push(a);
    }
    a.mood = mood || 'happy'; a.t = Date.now();
    this.speaker = id;
    this.renderCast();
  },
  renderCast() {
    $('#sCast').innerHTML = this.cast.map(a => '<div class="actor' + (a.id === this.speaker ? ' talk' : ' quiet') + (a.fresh ? ' enter' : '') + '">' + memberArt(a.id, { expr: a.mood }) + '</div>').join('');
    this.cast.forEach(a => { a.fresh = false; });
  },
  nameTag(id) { const info = speakerInfo(id); return '<div class="dname" style="--c:' + info.color + '">' + esc(info.name) + '</div>'; },
  say(st) {
    this.enter(st.s, st.m);
    this.full = fillText(st.t);
    this.lastLine = { id: st.s, text: this.full };
    $('#dBox').innerHTML = this.nameTag(st.s) + '<div class="dtext" id="dText"></div><div class="dnext" id="dNext" style="visibility:hidden">▼</div>';
    this.waiting = 'tap';
    this.type(speakerInfo(st.s).voice);
  },
  type(voice) {
    const el = $('#dText'), chars = Array.from(this.full);
    let i = 0;
    this.typing = true;
    clearInterval(this.typer);
    this.typer = setInterval(() => {
      i++;
      el.textContent = chars.slice(0, i).join('');
      if (i % 2 === 0 && /[a-z0-9]/i.test(chars[i - 1] || '')) Sound.play('blip', voice);
      if (i >= chars.length) this.endType();
    }, 26);
  },
  endType() {
    clearInterval(this.typer); this.typing = false;
    const el = $('#dText'); if (el) el.textContent = this.full;
    const nx = $('#dNext'); if (nx) nx.style.visibility = 'visible';
  },
  tap() {
    if (this.waiting === 'card') { this.closeCard(); return; }
    if (this.waiting !== 'tap') return;
    if (this.typing) { this.endType(); return; }
    this.waiting = null;
    this.next();
  },
  question() {
    if (!this.lastLine) return '';
    return this.nameTag(this.lastLine.id) + '<div class="dtext q">' + esc(this.lastLine.text) + '</div>';
  },
  choice(st) {
    this.waiting = 'choice';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dchoices">' + st.choice.map((c, i) => '<button class="btn white" data-c="' + i + '">' + esc(fillText(c.t)) + '</button>').join('') + '</div>';
    $$('[data-c]', box).forEach(b => b.addEventListener('click', () => {
      if (this.waiting !== 'choice') return;
      this.waiting = null;
      const c = st.choice[+b.getAttribute('data-c')];
      Sound.play('sparkle');
      if (c.set) Object.keys(c.set).forEach(k => { S[k] = c.set[k]; });
      if (c.flag) S.flags[c.flag] = true;
      Store.save();
      if (c.set && c.set.concept) { this.renderCast(); FX.burstAt($('#sCast'), { n: 30 }); }
      if (c.then) this.queue = c.then.concat(this.queue);
      this.next();
    }));
  },
  tierChoice() {
    this.waiting = 'choice';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dchoices">' + TIERS.map((t, i) => '<button class="btn white" data-t="' + i + '"><span style="font-size:26px">' + t.icon + '</span><span><b>' + t.name + '</b><br><small style="font-weight:500">' + t.desc + '</small></span></button>').join('') + '</div>';
    $$('[data-t]', box).forEach(b => b.addEventListener('click', () => {
      if (this.waiting !== 'choice') return;
      this.waiting = null;
      S.tier = +b.getAttribute('data-t'); Store.save();
      Sound.play('sparkle');
      this.next();
    }));
  },
  input() {
    this.waiting = 'input';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dinput"><input id="nameIn" maxlength="14" placeholder="Type your name" autocomplete="off" autocapitalize="words" enterkeyhint="done"><button class="btn pink" id="nameOk">OK</button></div>';
    const inp = $('#nameIn');
    const go = () => {
      if (this.waiting !== 'input') return;
      this.waiting = null;
      S.name = inp.value.trim().replace(/\s+/g, ' ').slice(0, 14) || 'Star';
      Store.save(); inp.blur();
      Sound.play('sparkle');
      this.next();
    };
    $('#nameOk').addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  },
  game(st) {
    if (st._i != null) { S.chapterStep = st._i; this.gameIdx = st._i; Store.save(); }
    this.clearTimers();
    Game.launch(st.game, { story: true, cfg: st.cfg });
  },
  gameWon() {
    if (this.gameIdx >= 0) { S.chapterStep = this.gameIdx + 1; this.gameIdx = -1; Store.save(); }
  },
  resume() {
    UI.closeAll();
    UI.show('scr-story');
    Music.start('full');
    this.renderCast();
    $('#dBox').innerHTML = '';
    this.next();
  },
  exit() {
    this.clearTimers();
    this.waiting = null;
    Screens.hub();
  },
  askExit() {
    UI.ask({
      title: 'Leave the story?', text: 'You can come back to this chapter any time from the studio.',
      buttons: [{ label: 'Keep reading', cls: 'white' }, { label: 'Leave', cls: 'pink', fn: () => this.exit() }]
    });
  },
  recruit(id) {
    if (S.members.indexOf(id) < 0) S.members.push(id);
    Store.save();
    this.enter(id, 'joy');
    Sound.play('fanfare');
    FX.rain(70);
    this.lastLine = { id, text: MEMBERS[id].name + ' joined Twinkle Tails!' };
    $('#dBox').innerHTML = '<div class="dname" style="--c:' + MEMBERS[id].color + '">New member!</div><div class="dtext">' + esc(MEMBERS[id].name) + ' joined Twinkle Tails! 🎉</div><div class="dnext">▼</div>';
    this.typing = false; this.waiting = 'tap';
  },
  reward(r) {
    if (r.hearts) S.hearts += r.hearts;
    const card = r.card && S.cards.indexOf(r.card) < 0 ? r.card : null;
    if (card) S.cards.push(card);
    Store.save();
    Sound.play('buy');
    FX.burstAt($('#dBox'), { n: 24, kinds: ['heart'], colors: ['#FF8FC4', '#FF5C8E', '#FFFFFF'] });
    $('#dBox').innerHTML = '<div class="dname" style="--c:#FFD65C">Reward</div><div class="dtext">You got ' + r.hearts + ' hearts' + (card ? ' and a shiny Dream Idol photocard!' : '!') + ' 💖</div><div class="dnext">▼</div>';
    this.typing = false; this.waiting = 'tap';
  },
  fx(kind) {
    if (kind === 'drum') Sound.play('drum');
    else if (kind === 'camera') {
      Sound.play('camera');
      const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f);
      setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 600);
    } else if (kind === 'fanfare') { Sound.play('fanfare'); FX.rain(90); }
    this.after(() => this.next(), kind === 'drum' ? 1100 : 500);
  },
  complete() {
    const done = S.chapter;
    S.chapter = done + 1; S.chapterStep = 0;
    if (S.chapter >= CHAPTERS.length) S.finished = true;
    Store.save();
    this.waiting = null;
    if (S.chapter >= CHAPTERS.length) { Screens.hub(); this.finale(); return; }
    const nx = CHAPTERS[S.chapter];
    const text = S.fans >= nx.fans ? 'Next up: "' + esc(nx.title) + '". It\'s ready to play right now!'
      : 'Next up: "' + esc(nx.title) + '". It opens when you have ' + nx.fans + ' ' + esc(S.fandom) + '. You have ' + S.fans + ', so you need ' + (nx.fans - S.fans) + ' more. Win practice games to get them!';
    Sound.play('win');
    UI.ask({ art: memberArt(pick(S.members), { expr: 'joy' }), title: 'Chapter ' + (done + 1) + ' complete!', text, dismiss: false,
      buttons: [{ label: 'Back to the studio', cls: 'pink', fn: () => Screens.hub() }] });
  },
  finale() {
    const crew = MEMBER_ORDER.map(id => '<div style="width:31%">' + memberArt(id, { expr: 'joy' }) + '</div>').join('');
    FX.rain(140);
    Sound.play('fanfare');
    UI.ask({ html: '<div style="display:flex;flex-wrap:wrap;justify-content:center;margin:-4px 0 4px">' + crew + '</div>', title: 'The end... for now!',
      text: 'Thank you, Producer ' + esc(S.name || '') + '! Keep playing to level up, try harder puzzles and collect every photocard.',
      buttons: [{ label: 'Back to the studio', cls: 'pink' }], dismiss: false });
  }
};

/* ===================== SCREENS ===================== */
const Screens = {
  styleSel: null, sayT: null,
  pills() {
    return '<span class="pill pill-hearts" aria-label="Hearts">' + Art.icon('heart') + S.hearts + '</span>' +
      '<span class="pill pill-fans" aria-label="' + esc(S.fandom) + '">' + Art.icon('lightstick') + S.fans + '</span>';
  },
  top(title) {
    return '<div class="topbar"><button class="ibtn" data-act="hub" aria-label="Back to the studio">' + Art.icon('back') + '</button>' +
      '<div class="grow"><h2>' + title + '</h2></div><span class="pill pill-hearts">' + Art.icon('heart') + S.hearts + '</span></div>';
  },

  /* ---------- title ---------- */
  title() {
    UI.closeAll();
    const spots = [
      { id: 'bao', l: 4, b: 38, w: 27 }, { id: 'maple', l: 36.5, b: 43, w: 27 }, { id: 'miso', l: 69, b: 38, w: 27 },
      { id: 'hazel', l: 0, b: 0, w: 32 }, { id: 'lulu', l: 34, b: 0, w: 32 }, { id: 'stella', l: 68, b: 0, w: 32 }
    ];
    $('#scr-title').innerHTML = '<div class="t-logo"><h1 class="logo">' + logoHTML('Twinkle') + '<br>' + logoHTML('Tails') + '</h1></div>' +
      '<p class="t-sub">A puzzle adventure with an idol group of animals</p>' +
      '<div class="t-crew">' + spots.map(p => '<div class="m" style="left:' + p.l + '%;bottom:' + p.b + '%;width:' + p.w + '%"><div class="bob" style="animation-delay:-' + (Math.random() * 2.6).toFixed(2) + 's">' +
        Art.member(p.id, { concept: S.started ? S.concept : 'candy', acc: S.wear[p.id] || 'none', expr: p.id === 'lulu' ? 'joy' : 'happy' }) + '</div></div>').join('') + '</div>' +
      '<button class="btn pink big" data-act="start">' + (S.started ? 'Continue' : 'Start') + '</button>' +
      (Store.ok ? '' : '<p class="t-note">This browser can\'t save progress here. Open the game from a web address to keep your stars.</p>');
    UI.show('scr-title');
  },

  /* ---------- hub ---------- */
  order() {
    const front = ['hazel', 'lulu', 'stella'].filter(m => S.members.indexOf(m) >= 0);
    const back = ['bao', 'maple', 'miso'].filter(m => S.members.indexOf(m) >= 0);
    return back.length ? [back, front] : [front];
  },
  hub() {
    UI.closeAll();
    const st = STAGES.find(s => s.id === S.stage) || STAGES[0];
    const rows = this.order();
    const deco = range(7).map(i => '<span class="deco" style="left:' + (6 + i * 13 + Math.random() * 6).toFixed(1) + '%;bottom:' + (10 + Math.random() * 40).toFixed(0) + '%;animation-delay:-' + (Math.random() * 11).toFixed(1) + 's">' + st.deco[i % st.deco.length] + '</span>').join('');
    const troupe = '<div class="troupe" id="troupe">' + rows.map((r, ri) => '<div class="row' + (rows.length > 1 && ri === 0 ? ' back' : '') + '">' +
      r.map(id => '<div class="mem" data-mem="' + id + '"><div class="bob" style="animation-delay:-' + (Math.random() * 2.6).toFixed(2) + 's">' + memberArt(id) + '</div></div>').join('') + '</div>').join('') + '</div>';
    const newGame = S.games.some(g => !S.seen[g]);
    $('#scr-hub').innerHTML =
      '<div class="topbar"><div class="grow hello">Producer ' + esc(S.name || '') + '</div>' + this.pills() +
      '<button class="ibtn" data-act="settings" aria-label="Settings">' + Art.icon('gear') + '</button></div>' +
      '<div class="stage st-' + S.stage + '" id="hubStage"><div class="spot l"></div><div class="spot r"></div>' +
      '<div class="marquee"><h1 class="logo">' + logoHTML(GROUP) + '</h1></div><div class="floor"></div>' + deco + troupe + '</div>' +
      this.storyCard() +
      '<div class="nav"><button class="btn mint rel" data-act="practice"><span class="em">🎮</span>Practice' + (newGame ? '<span class="badge">New</span>' : '') + '</button>' +
      '<button class="btn lilac" data-act="cards"><span class="em">🃏</span>Photocards</button>' +
      '<button class="btn" data-act="style"><span class="em">🎀</span>Style</button></div>';
    UI.show('scr-hub');
    Music.start('full');
    this.layoutTroupe();
  },
  layoutTroupe() {
    const stage = $('#hubStage');
    if (!stage) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    const rows = $$('#troupe .row', stage);
    const perRow = Math.max.apply(null, rows.map(r => r.children.length));
    let w = Math.min((W - 16) / perRow, perRow <= 2 ? 168 : 134);
    const ratio = 154 / 120;
    const maxH = rows.length === 1 ? H - 74 : (H - 64) / 1.62;
    w = Math.max(40, Math.min(w, maxH / ratio));
    rows.forEach((r, ri) => {
      const ww = rows.length === 2 && ri === 0 ? w * 0.86 : w;
      $$('.mem', r).forEach(m => { m.style.width = Math.floor(ww) + 'px'; });
    });
  },
  storyCard() {
    if (S.chapter >= CHAPTERS.length) {
      return '<div class="story-card"><div class="book">🏆</div><div class="txt"><div class="ch">Story complete</div><h3>Twinkle Tails are superstars!</h3><div class="need">Keep leveling up and collect every photocard.</div></div></div>';
    }
    const ch = CHAPTERS[S.chapter], ready = S.fans >= ch.fans;
    const pct = ch.fans ? Math.min(100, Math.round(S.fans / ch.fans * 100)) : 100;
    return '<div class="story-card' + (ready ? ' ready' : '') + '" data-act="story" role="button" tabindex="0"><div class="book">📖</div><div class="txt">' +
      '<div class="ch">Chapter ' + (S.chapter + 1) + ' of ' + CHAPTERS.length + '</div><h3>' + esc(ch.title) + '</h3>' +
      (ready ? '<div class="need">' + (S.chapterStep > 0 ? 'Tap to continue the story!' : 'Ready! Tap to play.') + '</div>'
        : '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="need">' + (ch.fans - S.fans) + ' more ' + esc(S.fandom) + ' needed. Practice to get more!</div>') +
      '</div></div>';
  },
  memberTap(id, el) {
    const m = MEMBERS[id];
    if (!m) return;
    UI.retrigger(el, 'jump');
    for (let i = 0; i < 5; i++) setTimeout(() => Sound.play('blip', m.voice), i * 70);
    const stage = $('#hubStage');
    if (!stage) return;
    const old = $('.stage-say', stage);
    if (old) old.parentNode.removeChild(old);
    const say = document.createElement('div');
    say.className = 'stage-say';
    say.innerHTML = faceHTML(id) + '<span>' + esc(fillText(pick(m.lines))) + '</span>';
    stage.appendChild(say);
    clearTimeout(this.sayT);
    this.sayT = setTimeout(() => { if (say.parentNode) say.parentNode.removeChild(say); }, 3400);
    FX.burstAt(el, { n: 8, kinds: ['heart'], speed: 3 });
  },

  /* ---------- practice ---------- */
  practice() {
    UI.closeAll();
    const t = TIERS[S.tier];
    $('#scr-practice').innerHTML = this.top('Practice room') +
      '<div class="tierline"><span>Puzzle level: ' + t.icon + ' ' + t.name + '</span><button class="btn small white" data-act="settings">Change</button></div>' +
      '<div class="scroll"><div class="glist">' + GAME_ORDER.map(id => this.gameCard(id)).join('') + '</div></div>';
    UI.show('scr-practice');
    Music.start('full');
  },
  gameCard(id) {
    const g = GAMES[id];
    if (S.games.indexOf(id) < 0) {
      let chIdx = 0;
      CHAPTERS.forEach((c, i) => { if (c.steps.some(st => st.unlock === id)) chIdx = i; });
      return '<div class="gcard locked"><div class="gi" style="background:' + g.bg + '">' + g.icon + '</div><div class="gt"><b>' + g.name + '</b>' +
        '<span class="gd">Unlocks in chapter ' + (chIdx + 1) + ' of the story.</span></div>' + Art.icon('lock') + '</div>';
    }
    return '<button class="gcard" data-act="play" data-game="' + id + '"><div class="gi" style="background:' + g.bg + '">' + g.icon + '</div>' +
      '<div class="gt"><b>' + g.name + '</b><span class="gd">' + g.desc + '</span><span class="gs">' + g.skill + '</span></div>' +
      '<div class="glv">Level<big>' + S.level[id] + '</big></div>' + (!S.seen[id] ? '<span class="badge">New</span>' : '') + '</button>';
  },

  /* ---------- photocards ---------- */
  cardArt(id, c) { return Art.member(id, { concept: c.outfit, expr: c.expr, acc: c.acc, mic: false }); },
  cards() {
    UI.closeAll();
    const total = MEMBER_ORDER.length * CONCEPTS.length;
    let html = this.top('Photocards') + '<div class="cards-sub">' + S.cards.length + ' of ' + total + ' collected. Tap a card to see it or collect it.</div><div class="scroll">';
    MEMBER_ORDER.forEach(id => {
      const known = S.members.indexOf(id) >= 0;
      html += '<div class="cgroup"><h3>' + (known ? faceHTML(id) + esc(MEMBERS[id].name) : '<span class="face" style="--c:#EEE8F4;font-size:18px">?</span>Secret member') + '</h3><div class="cards-grid">' +
        CONCEPTS.map(c => {
          const cid = id + '-' + c.id, owned = S.cards.indexOf(cid) >= 0;
          if (!known) return '<div class="pcard pc-' + c.id + ' not"><div class="tag">🔒</div></div>';
          return '<div class="pcard pc-' + c.id + (owned ? '' : ' not') + (c.shiny ? ' shiny' : '') + '" data-card="' + cid + '"><div class="pa">' + this.cardArt(id, c) + '</div>' +
            (owned ? '' : '<div class="tag">' + Art.icon('heart') + c.price + '</div>') + '</div>';
        }).join('') + '</div></div>';
    });
    html += '<div style="height:24px"></div></div>';
    $('#scr-cards').innerHTML = html;
    UI.show('scr-cards');
    Music.start('full');
  },
  cardTap(cid) {
    const parts = cid.split('-'), id = parts[0], c = CONCEPTS.find(x => x.id === parts[1]);
    if (!MEMBERS[id] || !c) return;
    if (S.cards.indexOf(cid) >= 0) { this.viewCard(cid); return; }
    const can = S.hearts >= c.price;
    UI.ask({
      html: '<div class="bigcard pc-' + c.id + (c.shiny ? ' shiny' : '') + '" style="width:150px"><div class="pa" style="filter:brightness(0);opacity:.2">' + this.cardArt(id, c) + '</div></div>',
      title: esc(MEMBERS[id].name) + ': ' + esc(c.name),
      text: can ? 'Collect this photocard for ' + c.price + ' hearts? You have ' + S.hearts + '.' : 'This card costs ' + c.price + ' hearts. You have ' + S.hearts + ', so you need ' + (c.price - S.hearts) + ' more. Practice to earn hearts!',
      buttons: can ? [{ label: 'Not now', cls: 'white' }, { label: 'Collect it', cls: 'pink', fn: () => {
        S.hearts -= c.price; S.cards.push(cid); Store.save();
        Sound.play('buy'); FX.rain(50);
        this.cards(); this.viewCard(cid);
      } }] : [{ label: 'OK', cls: 'pink' }]
    });
  },
  viewCard(cid) {
    const parts = cid.split('-'), id = parts[0], c = CONCEPTS.find(x => x.id === parts[1]), m = MEMBERS[id];
    const back = UI.modal('<div class="bigcard pc-' + c.id + (c.shiny ? ' shiny' : '') + '" id="bigCard"><div class="pa">' + this.cardArt(id, c) + '</div>' +
      '<div class="nm">' + esc(m.name) + '<small>' + esc(c.name) + '</small></div></div>' +
      '<p class="bio"><b>' + esc(m.role) + '.</b> ' + esc(m.bio) + '</p><div class="row"><button class="btn pink" data-close>Close</button></div>');
    const card = $('#bigCard', back);
    back.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = clamp((e.clientX - r.left) / r.width - 0.5, -0.6, 0.6), y = clamp((e.clientY - r.top) / r.height - 0.5, -0.6, 0.6);
      card.style.setProperty('--ry', (x * 18).toFixed(1) + 'deg'); card.style.setProperty('--rx', (-y * 18).toFixed(1) + 'deg');
    });
    back.addEventListener('pointerleave', () => { card.style.setProperty('--ry', '0deg'); card.style.setProperty('--rx', '0deg'); });
  },

  /* ---------- style shop ---------- */
  style(sel) {
    UI.closeAll();
    if (sel) this.styleSel = sel;
    if (!this.styleSel || S.members.indexOf(this.styleSel) < 0) this.styleSel = S.members[0];
    const id = this.styleSel, scrollTop = $('#scr-style .scroll') ? $('#scr-style .scroll').scrollTop : 0;
    $('#scr-style').innerHTML = this.top('Style shop') + '<div class="scroll">' +
      '<div class="stage style-top st-' + S.stage + '"><div class="spot l"></div><div class="spot r"></div><div class="floor"></div>' +
      '<div class="mem"><div class="bob">' + memberArt(id, { expr: 'joy' }) + '</div></div></div>' +
      '<div class="mem-tabs">' + S.members.map(m => '<button class="mem-tab' + (m === id ? ' on' : '') + '" data-act="styleMem" data-id="' + m + '" aria-label="' + MEMBERS[m].name + '">' + faceHTML(m) + '</button>').join('') + '</div>' +
      '<h3 class="shop-h">Accessories for ' + esc(MEMBERS[id].name) + '</h3><div class="shop-grid">' + ACCS.map(a => {
        const owned = S.accs.indexOf(a.id) >= 0, wearing = (S.wear[id] || 'none') === a.id;
        return '<button class="item' + (wearing ? ' on' : '') + '" data-act="acc" data-id="' + a.id + '"><div class="ic">' + Art.accIcon(a.id) + '</div>' + esc(a.name) +
          '<div class="st">' + (wearing ? 'Wearing' : owned ? 'Tap to wear' : Art.icon('heart') + a.price) + '</div></button>';
      }).join('') + '</div>' +
      '<h3 class="shop-h">Stage themes</h3><div class="shop-grid">' + STAGES.map(s => {
        const owned = S.stages.indexOf(s.id) >= 0, on = S.stage === s.id;
        return '<button class="item' + (on ? ' on' : '') + '" data-act="stagePick" data-id="' + s.id + '"><div class="swatch st-' + s.id + '"></div>' + esc(s.name) +
          '<div class="st">' + (on ? 'On stage' : owned ? 'Tap to use' : Art.icon('heart') + s.price) + '</div></button>';
      }).join('') + '</div><div style="height:24px"></div></div>';
    UI.show('scr-style');
    const sc = $('#scr-style .scroll');
    if (sc) sc.scrollTop = scrollTop;
    Music.start('full');
  },
  buy(price, what, onBuy) {
    if (S.hearts < price) {
      UI.ask({ title: 'Not enough hearts yet', text: what + ' costs ' + price + ' hearts. You have ' + S.hearts + ', so you need ' + (price - S.hearts) + ' more. Practice to earn hearts!', buttons: [{ label: 'OK', cls: 'pink' }] });
      return;
    }
    UI.ask({
      title: 'Buy ' + what + '?', text: 'It costs ' + price + ' hearts. You have ' + S.hearts + '. After buying you\'ll have ' + (S.hearts - price) + '.',
      buttons: [{ label: 'Not now', cls: 'white' }, { label: 'Buy it', cls: 'pink', fn: () => { S.hearts -= price; onBuy(); Store.save(); Sound.play('buy'); FX.rain(40); } }]
    });
  },
  accTap(accId) {
    const a = ACCS.find(x => x.id === accId), id = this.styleSel;
    if (!a || !id) return;
    const wear = () => { S.wear[id] = a.id; Store.save(); this.style(); };
    if (S.accs.indexOf(a.id) >= 0) { Sound.play('place'); wear(); return; }
    this.buy(a.price, 'the ' + a.name.toLowerCase(), () => { S.accs.push(a.id); wear(); });
  },
  stageTap(stId) {
    const s = STAGES.find(x => x.id === stId);
    if (!s) return;
    const use = () => { S.stage = s.id; Store.save(); this.style(); };
    if (S.stages.indexOf(s.id) >= 0) { Sound.play('place'); use(); return; }
    this.buy(s.price, 'the ' + s.name.toLowerCase() + ' stage', () => { S.stages.push(s.id); use(); });
  },

  /* ---------- settings ---------- */
  settings() {
    const back = UI.modal('<h2>Settings</h2>' +
      '<div class="set-row">Sound effects<button class="toggle' + (S.sfx ? ' on' : '') + '" data-set="sfx" aria-label="Sound effects"><i></i></button></div>' +
      '<div class="set-row">Music<button class="toggle' + (S.music ? ' on' : '') + '" data-set="music" aria-label="Music"><i></i></button></div>' +
      '<h3>Puzzle level</h3><div class="seg">' + TIERS.map((t, i) => '<button class="' + (S.tier === i ? 'on' : '') + '" data-tier="' + i + '"><span class="em">' + t.icon + '</span>' + t.name + '</button>').join('') + '</div>' +
      '<p class="tierdesc" id="tierDesc">' + TIERS[S.tier].desc + '</p>' +
      '<h3>Producer name</h3><div class="dinput"><input class="field" id="setName" maxlength="14" value="' + esc(S.name) + '" autocomplete="off"><button class="btn small mint" id="setNameOk">Save</button></div>' +
      '<div class="row"><button class="btn white" id="grownups">For grown-ups</button><button class="btn pink" data-close>Done</button></div>');
    $$('[data-set]', back).forEach(b => b.addEventListener('click', () => {
      const k = b.getAttribute('data-set');
      S[k] = !S[k]; b.classList.toggle('on', S[k]); Store.save();
      if (k === 'music') { if (S.music) Music.start(UI.current === 'scr-game' ? 'calm' : 'full'); else Music.stop(); }
      Sound.play('tap');
    }));
    $$('[data-tier]', back).forEach(b => b.addEventListener('click', () => {
      S.tier = +b.getAttribute('data-tier'); Store.save();
      $$('[data-tier]', back).forEach(x => x.classList.toggle('on', x === b));
      $('#tierDesc', back).textContent = TIERS[S.tier].desc + ' New rounds will use this level.';
      Sound.play('place');
      if (UI.current === 'scr-practice') this.practice();
    }));
    $('#setNameOk', back).addEventListener('click', () => {
      const v = $('#setName', back).value.trim().replace(/\s+/g, ' ').slice(0, 14);
      if (!v) { UI.retrigger($('#setName', back), 'shake'); return; }
      S.name = v; Store.save(); Sound.play('sparkle'); UI.toast('Hello, Producer ' + esc(v) + '!');
      if (UI.current === 'scr-hub') { const h = $('#scr-hub .hello'); if (h) h.textContent = 'Producer ' + v; }
    });
    $('#grownups', back).addEventListener('click', () => { UI.closeModal(back); this.parentGate(() => this.parents()); });
  },
  parentGate(then) {
    const a = rand(6, 9), b = rand(12, 19);
    UI.ask({
      title: 'Grown-ups only', text: 'What is ' + a + ' × ' + b + '?',
      html: '<input class="field" id="pgIn" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:22px">',
      buttons: [{ label: 'Cancel', cls: 'white' }, { label: 'OK', cls: 'pink', keep: true, fn: back => {
        const inp = $('#pgIn', back);
        if (+inp.value === a * b) { UI.closeModal(back); then(); } else { inp.value = ''; UI.retrigger(inp, 'shake'); }
      } }]
    });
  },
  parents() {
    const s = S.stats;
    const stat = (n, l) => '<div class="stat"><b>' + n + '</b>' + l + '</div>';
    const back = UI.modal('<h2>For grown-ups</h2>' +
      '<p>Twinkle Tails wraps short brain workouts in an idol-group story. Everything runs on this device: no ads, no accounts, no purchases, and nothing is sent anywhere.</p>' +
      '<div class="stat-grid">' + stat(s.won, 'rounds won') + stat(s.stars, 'stars earned') + stat(s.sums, 'additions made') + stat(s.orders, 'exact orders') +
      stat(s.patterns, 'patterns solved') + stat(s.dances, 'dances memorized') + stat(s.photos, 'logic grids') + stat(s.clues, 'clue puzzles') + '</div>' +
      '<h3>What each game practices</h3>' +
      '<p class="skill"><b>🍬 Candy Orders:</b> mental addition and planning ahead with limited moves. Superstar level adds doubling.</p>' +
      '<p class="skill"><b>💃 Dance Practice:</b> working memory. Sequences grow longer; Superstar sometimes asks for them backwards.</p>' +
      '<p class="skill"><b>🥁 Pattern Parade:</b> number sequences, skip counting, doubling and repeating patterns, with a short explanation after every answer.</p>' +
      '<p class="skill"><b>📸 Photo Shoot:</b> sudoku-style deduction with pictures instead of numbers (4×4, then 6×6).</p>' +
      '<p class="skill"><b>🔍 Stage Clues:</b> reading carefully and logical reasoning: left, right, next to, between, not.</p>' +
      '<p class="skill">The story also asks her to make choices, name things and budget hearts in the shops. Puzzle level can be changed any time in Settings.</p>' +
      '<h3>Install it like an app</h3>' +
      '<p class="skill"><b>iPhone / iPad:</b> open the game\'s web address in Safari, tap Share, then "Add to Home Screen".<br><b>Android:</b> open it in Chrome, tap ⋮, then "Add to Home screen" or "Install app".<br>Progress is saved on the device. No sound on iPhone? Check the silent switch.</p>' +
      '<h3>Back up progress</h3><p class="skill">Copy this code and keep it somewhere safe. Paste it below on another device to continue there.</p>' +
      '<textarea class="field" id="bkOut" readonly></textarea><div class="row"><button class="btn small white" id="bkCopy">Copy code</button></div>' +
      '<textarea class="field" id="bkIn" placeholder="Paste a backup code here" style="margin-top:12px"></textarea><div class="row"><button class="btn small mint" id="bkLoad">Restore progress</button></div>' +
      '<h3>Start over</h3><div class="row"><button class="btn small white" id="resetAll">Erase all progress</button></div>' +
      '<div class="row"><button class="btn pink" data-close>Done</button></div>', { cls: 'left' });
    $('#bkOut', back).value = Store.exportCode();
    $('#bkCopy', back).addEventListener('click', () => {
      const ta = $('#bkOut', back);
      const ok = () => UI.toast('Backup code copied!');
      const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { UI.toast('Select the code and copy it.'); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
    });
    $('#bkLoad', back).addEventListener('click', () => {
      if (Store.importCode($('#bkIn', back).value)) { UI.closeAll(); UI.toast('Progress restored!'); this.hub(); }
      else UI.toast('That code didn\'t work. Check that it was copied completely.');
    });
    $('#resetAll', back).addEventListener('click', () => {
      UI.ask({ title: 'Erase everything?', text: 'All stars, hearts, photocards and story progress will be deleted. This can\'t be undone.',
        buttons: [{ label: 'Keep it', cls: 'white' }, { label: 'Erase', cls: 'pink', fn: () => { Store.reset(); UI.closeAll(); Music.stop(); this.title(); } }] });
    });
  }
};

/* ===================== MAIN ===================== */
const ACT = {
  start() {
    Sound.unlock();
    if (!S.started) { S.started = true; Store.save(); Music.start('full'); Story.begin(); }
    else Screens.hub();
  },
  hub: () => Screens.hub(),
  practice: () => Screens.practice(),
  cards: () => Screens.cards(),
  style: () => Screens.style(),
  settings: () => Screens.settings(),
  story: () => {
    if (Story.ready()) Story.begin();
    else if (S.chapter < CHAPTERS.length) UI.toast('Win practice games to earn more ' + esc(S.fandom) + '!');
  },
  play: el => Game.launch(el.getAttribute('data-game')),
  quitGame: () => Game.quit(),
  storyClose: () => Story.askExit(),
  styleMem: el => Screens.style(el.getAttribute('data-id')),
  acc: el => Screens.accTap(el.getAttribute('data-id')),
  stagePick: el => Screens.stageTap(el.getAttribute('data-id'))
};

/* home-screen icon, drawn with canvas so the file needs no image assets */
function makeIcon(size) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    if (!x || !x.ellipse) return null;
    const s = size / 100;
    const g = x.createLinearGradient(0, 0, 0, size);
    g.addColorStop(0, '#CDB8FF'); g.addColorStop(1, '#FF9FCF');
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    x.strokeStyle = '#4B2E5C'; x.lineJoin = 'round'; x.lineCap = 'round';
    const ell = (cx, cy, rx, ry, rot, fill, lw) => {
      x.beginPath(); x.ellipse(cx * s, cy * s, rx * s, ry * s, rot, 0, Math.PI * 2);
      x.fillStyle = fill; x.fill();
      if (lw) { x.lineWidth = lw * s; x.stroke(); }
    };
    ell(38, 31, 7.5, 18, -0.22, '#FFFFFF', 3); ell(38, 32, 3.6, 12, -0.22, '#FFC2DC');
    ell(62, 31, 7.5, 18, 0.24, '#FFFFFF', 3); ell(62, 32, 3.6, 12, 0.24, '#FFC2DC');
    ell(50, 61, 30, 26, 0, '#FFFFFF', 3);
    ell(39, 60, 4.6, 6, 0, '#3A2346'); ell(61, 60, 4.6, 6, 0, '#3A2346');
    ell(40.6, 57.6, 1.9, 1.9, 0, '#FFFFFF'); ell(62.6, 57.6, 1.9, 1.9, 0, '#FFFFFF');
    ell(30.5, 68, 5.2, 3, 0, 'rgba(255,143,196,.75)'); ell(69.5, 68, 5.2, 3, 0, 'rgba(255,143,196,.75)');
    ell(50, 65.5, 2.3, 1.6, 0, '#FF86B6');
    x.lineWidth = 2 * s;
    x.beginPath(); x.moveTo(46 * s, 69 * s); x.quadraticCurveTo(48 * s, 72 * s, 50 * s, 69.6 * s); x.quadraticCurveTo(52 * s, 72 * s, 54 * s, 69 * s); x.stroke();
    x.beginPath();
    for (let i = 0; i < 10; i++) { const r = (i % 2 ? 4 : 9) * s, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(79 * s + Math.cos(a) * r, 24 * s + Math.sin(a) * r); }
    x.closePath(); x.fillStyle = '#FFD65C'; x.fill(); x.lineWidth = 2.2 * s; x.stroke();
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}
function setupPWA() {
  try {
    const i180 = makeIcon(180), i192 = makeIcon(192), i512 = makeIcon(512);
    const link = (rel, href, type) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (type) l.type = type; document.head.appendChild(l); };
    if (i180) link('apple-touch-icon', i180);
    if (i192) link('icon', i192, 'image/png');
    if (/^https?:$/.test(location.protocol) && i192 && i512) {
      const start = location.origin + location.pathname + location.search;
      const scope = location.origin + location.pathname.replace(/[^/]*$/, '');
      const man = {
        name: 'Twinkle Tails', short_name: 'Twinkle Tails', start_url: start, scope, display: 'standalone', orientation: 'portrait',
        background_color: '#FFF0F7', theme_color: '#F4BCE0',
        icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }]
      };
      link('manifest', URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })));
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
          if (window.caches) caches.open('twinkle-tails-v1').then(cache => cache.add(start)).catch(() => {});
        }).catch(() => { /* sw.js is optional: without it the game still works online */ });
      }
    }
  } catch (e) { /* installing is optional */ }
}

function init() {
  Store.load();
  FX.init();
  setupPWA();
  const unlock = () => Sound.unlock();
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('click', e => {
    const t = e.target;
    if (!t || !t.closest) return;
    const a = t.closest('[data-act]');
    if (a) {
      if (a.disabled) return;
      const fn = ACT[a.getAttribute('data-act')];
      if (fn) { Sound.play('tap'); fn(a, e); }
      return;
    }
    const mem = t.closest('[data-mem]');
    if (mem) { Screens.memberTap(mem.getAttribute('data-mem'), mem); return; }
    const card = t.closest('[data-card]');
    if (card) { Sound.play('tap'); Screens.cardTap(card.getAttribute('data-card')); }
  });
  $('#scr-story').addEventListener('click', e => {
    if (e.target.closest && e.target.closest('button, input, textarea')) return;
    Story.tap();
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (UI.current === 'scr-story' && !$('#modalRoot .modal-back')) { e.preventDefault(); Story.tap(); return; }
    if (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Store.save();
      if (Sound.ctx) { try { Sound.ctx.suspend(); } catch (err) { /* ignore */ } }
    } else if (Sound.ctx) {
      try { const p = Sound.ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ }
    }
  });
  window.addEventListener('pagehide', () => Store.save());
  window.addEventListener('resize', () => { if (UI.current === 'scr-hub') Screens.layoutTroupe(); });
  Screens.title();
  window.__TT = { get S() { return S; }, Game, Story, Screens, Logic, Store, UI, Sound, Music, GAMEMODS };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
</script>
