const PAT_POOLS = [
  [{ g: 'ab', w: 3 }, { g: 'abc', w: 2 }, { g: 'aab', w: 2 }, { g: 'up1', w: 3 }, { g: 'down1', w: 2, min: 2 }, { g: 'up2', w: 2, min: 2 }, { g: 'abb', w: 2, min: 3 }, { g: 'up5', w: 1, min: 4 }, { g: 'up10', w: 1, min: 5 }],
  [{ g: 'upK', w: 3 }, { g: 'downK', w: 2 }, { g: 'up10s', w: 2 }, { g: 'abbc', w: 1 }, { g: 'double', w: 2, min: 2 }, { g: 'hideMid', w: 2, min: 2 }, { g: 'up5', w: 1 }, { g: 'alt', w: 1, min: 4 }],
  [{ g: 'grow', w: 2 }, { g: 'mul', w: 2 }, { g: 'half', w: 1 }, { g: 'upKbig', w: 1 }, { g: 'squares', w: 1, min: 2 }, { g: 'fib', w: 2, min: 2 }, { g: 'bigDown', w: 1 }, { g: 'hideMidHard', w: 2 }, { g: 'altOps', w: 2, min: 3 }]

Logic.patternSet = function (tier, level, pics, count) {
  const pool = PAT_POOLS[tier].filter(e => !e.min || level >= e.min);
  const out = []; let last = null;
  while (out.length < count) {
    const cands = pool.filter(e => e.g !== last);
    let total = 0; cands.forEach(e => { total += e.w; });
    let r = Math.random() * total, ch = cands[0];
    for (const e of cands) { r -= e.w; if (r <= 0) { ch = e; break; } }
    last = ch.g;
    const q = PATGEN[ch.g](pics);
    q.gen = ch.g;
    q.options = Logic.patternOptions(q, tier, pics);
    out.push(q);
  }
  return out;
};
Logic.patternOptions = function (q, tier, pics) {
  if (q.kind === 'pic') {
    const inPat = q.items.filter((t, i, a) => a.indexOf(t) === i);
    const extra = pics.filter(t => inPat.indexOf(t) < 0);
    const opts = inPat.slice(0, 3);
    if (opts.length < 3 && extra.length) opts.push(pick(extra));
    if (opts.indexOf(q.answer) < 0) opts[0] = q.answer;
    return shuffle(opts);
  }
  const n = tier === 0 ? 3 : 4, ans = q.answer, it = q.items;
  const diff = Math.abs(it[1] - it[0]) || 1;
  const cands = shuffle([ans + 1, ans - 1, ans + diff, ans - diff, ans + 2, ans - 2, ans + 10, ans - 10, it[q.hide === 0 ? 1 : q.hide - 1]]);
  const opts = [ans];
  cands.forEach(c => { if (opts.length < n && c >= 0 && opts.indexOf(c) < 0) opts.push(c); });
  let x = 3;
  while (opts.length < n) { if (opts.indexOf(ans + x) < 0) opts.push(ans + x); x++; }
  return shuffle(opts);
};

      if (this.sel >= 0) { this.sel = -1; }
      d.el.classList.remove('sel');
      d.el.classList.add('dragging');
      Sound.play('pick');
    }
    if (e.cancelable) e.preventDefault();
    d.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.12)';
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = t && t.closest ? (t.closest('.mcell') || t.closest('.order') || t.closest('#mBin')) : null;
    if (tgt !== d.over) {
      if (d.over) d.over.classList.remove('drop-ok');
      d.over = tgt;
      if (tgt && !(tgt.classList.contains('mcell') && +tgt.getAttribute('data-i') === d.i)) tgt.classList.add('drop-ok');
    }
  },
  onUp(e) {
    const d = this.drag;
    if (!d || e.pointerId !== d.id) return;
    this.drag = null;
    if (d.over) d.over.classList.remove('drop-ok');
    if (!d.moved) { if (e.type === 'pointerup') this.tapCell(d.i); return; }
    d.el.classList.remove('dragging'); d.el.style.transform = '';
    const t = e.type === 'pointercancel' ? null : document.elementFromPoint(e.clientX, e.clientY);
    this.dropOn(d.i, t);
  },
  dropOn(i, t) {
    if (this.over || !t || !t.closest) { this.render(); return; }
    const order = t.closest('.order'), bin = t.closest('#mBin'), cell = t.closest('.mcell');
    if (order) this.deliver(i, +order.getAttribute('data-k'));
    else if (bin) this.recycle(i);
    else if (cell) {
      const j = +cell.getAttribute('data-i');
      if (j === i) this.render();
      else if (this.cells[j] == null) this.moveTo(i, j);
      else this.merge(i, j);
    } else this.render();
  },
  tapCell(i) {
    const v = this.cells[i];
    if (v == null || this.over) return;
    if (this.sel === i) { this.sel = -1; this.render(); return; }
    if (this.sel >= 0) { const s = this.sel; this.sel = -1; this.merge(s, i); return; }
    const k = this.orders.findIndex(o => o.t === v);
    if (v > 0 && k >= 0) { this.deliver(i, k); return; }
    this.sel = i; Sound.play('pick'); this.render();
  },
  orderTap(k) {
    if (this.over) return;
    if (this.sel >= 0) { const s = this.sel; this.sel = -1; this.deliver(s, k); return; }
    const o = this.orders[k];
    if (o) UI.toast(T('{fan} wants a candy with exactly {n}.', { fan: o.fan, n: o.t }));
  },
  binTap() {
    if (this.over) return;
    if (this.sel >= 0) { const s = this.sel; this.sel = -1; this.recycle(s); return; }
    UI.toast(T('Drag a candy you don\'t need onto the bin. It\'s free!'));
  },
  merge(i, j) {
    const a = this.cells[i], b = this.cells[j];
    if (this.over || a == null || b == null || i === j) { this.render(); return; }
    if (a === DOUBLE && b === DOUBLE) { this.nope(j, T('Two ×2 stars can\'t mix. Put one on a number candy!')); return; }
    if (this.moves <= 0) { this.nope(j, T('No moves left!')); return; }
    const v = a === DOUBLE ? b * 2 : b === DOUBLE ? a * 2 : a + b;
    if (v > 99) { this.nope(j, T('That candy would be way too big!')); return; }
    this.moves--; this.sums++;
    this.cells[i] = null; this.cells[j] = v;
    this.render();
    const el = this.cellEl(j);
    if (el) {
      const c = el.querySelector('.candy'); if (c) c.classList.add('pop');
      FX.burstAt(el, { n: 10, speed: 3, kinds: ['star', 'dot'], size: 6 });
      UI.floatAt(el, a === DOUBLE || b === DOUBLE ? (a === DOUBLE ? b : a) + ' × 2 = ' + v : a + ' + ' + b + ' = ' + v);
    }
    Sound.play('merge', v);
    if (this.tut === 1) this.tutStep(2);
    this.after();
  },
  deliver(i, k) {
    const v = this.cells[i], o = this.orders[k];
    if (this.over || v == null || !o) { this.render(); return; }
    if (v !== o.t) {
      const msg = v === DOUBLE ? T('That\'s a ×2 star. Drop it on a number candy to double it!')
        : v < o.t ? T('{v} is too small. {fan} needs {n} more.', { v, fan: o.fan, n: o.t - v })
          : T('{v} is too big. That\'s {n} too many.', { v, n: v - o.t });
      this.nope(i, msg, k);
      return;
    }
    const cellEl = this.cellEl(i), orderEl = this.orderEl(k);
    this.flyCandy(cellEl, orderEl, v);
    if (orderEl) {
      FX.burstAt(orderEl, { n: 18, kinds: ['heart'], colors: ['#FF8FC4', '#FF5C8E', '#FFB3D6', '#FFFFFF'] });
      UI.floatAt(orderEl, '💖 ' + T('Thank you!'));
    }
    Sound.play('deliver');
    this.cells[i] = null; this.done++;
    this.orders.splice(k, 1);
    if (this.orders.length < Math.min(this.p.show, this.p.orders - this.done)) this.addOrder(k, true);
    this.render();
    if (this.tut === 2) this.tutStep(3);
    this.after();
  },
  flyCandy(fromEl, toEl, v) {
    if (!fromEl || !toEl) return;
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'candy';
    f.style.cssText = 'position:fixed;left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px;right:auto;bottom:auto;--c:' +
      Art.candyColor(v) + ';font-size:' + Math.round(a.height * 0.4) + 'px;z-index:70;pointer-events:none;transition:transform .45s cubic-bezier(.5,-0.3,.6,1),opacity .45s;';
    f.textContent = v;
    document.body.appendChild(f);
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.35)'; f.style.opacity = '.2'; }));
    setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 520);
  },
  spawn() {
    if (this.over) return;
    this.poke(); UI.clearHand();
    if (this.moves <= 0) { UI.toast(T('No moves left!')); return; }
    const empty = [];
    this.cells.forEach((v, i) => { if (v == null) empty.push(i); });
    if (!empty.length) { Sound.play('error'); UI.toast(T('The board is full! Merge candies or use the bin.')); UI.retrigger($('#mBin'), 'shake'); return; }
    const nums = this.cells.filter(v => v > 0), targets = this.orders.map(o => o.t);
    const v = (this.p.dbl && Math.random() < 0.12 && this.cells.indexOf(DOUBLE) < 0) ? DOUBLE : Logic.spawnValue(this.p, nums, targets);
    const i = pick(empty);
    this.moves--; this.cells[i] = v; this.sel = -1;
    this.render();
    const el = this.cellEl(i), c = el && el.querySelector('.candy');
    if (c) c.classList.add('pop');
    Sound.play('spawn');
    if (v === DOUBLE && !this.seenDouble) { this.seenDouble = true; UI.toast(T('A magic ×2 star! Drop it on a candy to double it.'), 3400); }
    this.after();
  },
  recycle(i) {
    if (this.over || this.cells[i] == null) { this.render(); return; }
    this.cells[i] = null; this.sel = -1;
    Sound.play('whoosh');
    this.render();
    this.after();
  },
  moveTo(i, j) {
    if (this.cells[i] == null || this.cells[j] != null) { this.render(); return; }
    this.cells[j] = this.cells[i]; this.cells[i] = null;
    Sound.play('place');
    this.render();
  },
  nope(i, msg, k) {
    Sound.play('error');
    this.render();
    const el = this.cellEl(i);
    if (el) UI.retrigger(el.querySelector('.candy'), 'shake');
    if (k != null) UI.retrigger(this.orderEl(k), 'shake');
    UI.toast(msg, 2800);
  },
  after() {
    this.renderHud();
    if (this.done >= this.p.orders) {
      this.over = true;
      this.later(() => Game.finish(true, Logic.mergeStars(this.moves, this.total), { orders: this.p.orders, sums: this.sums }), 700);
      return;
    }
    if (this.moves <= 0) {
      const any = this.cells.some(v => v > 0 && this.orders.some(o => o.t === v));
      if (!any) { this.over = true; this.later(() => Game.finish(false, 0), 900); }
      else if (!this.warned) { this.warned = true; UI.toast(T('Out of moves! But you can still give away matching candy.'), 3200); }
    }
  },
  hint() {
    if (this.over) return;
    if (this.hints <= 0) { UI.toast(T('No hints left this round. You can do it!')); return; }
    this.hints--;
    this.renderHud();
    this.showHint(true);
  },
  showHint(manual) {
    const h = Logic.mergeHint(this.cells, this.orders.map(o => o.t), this.p);
    if (h.type === 'deliver') {
      const k = this.orders.findIndex(o => o.t === this.cells[h.i]);
      UI.hand(this.cellEl(h.i), this.orderEl(k));
      if (manual) UI.toast(T('This candy matches an order. Give it away!'));
    } else if (h.type === 'merge') {
      UI.hand(this.cellEl(h.i), this.cellEl(h.j));
      if (manual) UI.toast(this.cells[h.i] === DOUBLE ? T('Try the ×2 star on this candy!') : T('Try putting these two together!'));
    } else if (h.type === 'spawn') {
      UI.hand($('#mSpawn'));
      if (manual) UI.toast(T('Get a new candy from the gift box!'));
    } else {
      UI.hand(this.cellEl(h.i), $('#mBin'));
      if (manual) UI.toast(T('This candy is too big for any order. Put it in the bin!'));
    }
  },
  tutStep(n) {
    this.tut = n;
    const lines = {
      1: T('Drag one candy onto another to add them together!'),
      2: T('When a candy matches a fan\'s number, tap it to give it to them!'),
      3: T('Need more candy? Tap the gift box. Every merge or new candy uses 1 move.')
    };
    const coach = $('#mCoach');
    coach.innerHTML = '<div class="coach">' + faceHTML('hazel') + '<span class="grow">' + lines[n] + '</span>' +
      (n === 3 ? '<button class="btn small mint" id="mTutOk">' + T('Got it') + '</button>' : '') + '</div>';
    if (n === 3) {
      $('#mTutOk').addEventListener('click', () => {
        Sound.play('tap'); coach.innerHTML = ''; this.tut = 0; S.tut.merge = true; Store.saveSoon(); this.layout(); this.poke();
      });
    }
    this.layout();
    if (n < 3) this.later(() => { if (!this.drag) this.showHint(false); }, 800);
  }
};

/* ===================== Dance Practice (memory) ===================== */
const DanceGame = {
  PADS: [{ em: '💖', name: 'Heart', c: '#FF9FCF' }, { em: '⭐', name: 'Spin', c: '#FFD86B' }, { em: '🎵', name: 'Clap', c: '#7FE8C9' }, { em: '🌈', name: 'Wave', c: '#C4AAFF' }],
  start(root, o) {
    this.o = o; this.root = root; this.timers = []; this.later = laterFor(this);
    const p = o.story ? STORY_CFG[o.cfg](o.tier) : Logic.danceParams(o.tier, o.level);
    this.p = p; this.seq = []; this.lives = p.lives; this.mistakes = 0; this.phase = 'idle'; this.idx = 0;
    this.dancerId = (o.story || S.members.indexOf('stella') >= 0) ? 'stella' : 'lulu';
    root.innerHTML = Game.header(o.story ? T('Stella\'s dance test') : T(GAMES.dance.name), o.level, o.story) +
      '<div class="stage dstage st-' + S.stage + '" id="dStage"><div class="spot l"></div><div class="spot r"></div><div class="floor"></div>' +
      '<div class="dsay" id="dSay"></div><div class="dancer" id="dDancer"></div></div>' +
      '<div class="dstatus"><div class="dots" id="dDots"></div><div class="hearts" id="dLives"></div></div>' +
      '<div class="pads locked" id="dPads">' + this.PADS.map((pd, i) => '<button class="pad" data-pad="' + i + '" style="--c:' + pd.c + '" aria-label="' + T(pd.name) + '">' + pd.em + '<small>' + T(pd.name) + '</small></button>').join('') + '</div>';
    this.dancerEl = $('#dDancer'); this.stageEl = $('#dStage'); this.padEls = $$('.pad', root);
    this.setFace('happy');
    this.padEls.forEach((el, i) => {
      el.addEventListener('pointerdown', e => { e.preventDefault(); this.press(i); });
      el.addEventListener('click', e => { if (e.detail === 0) this.press(i); });
    });
    this.status();
    this.say(p.mirror ? T('Mirror dance! Copy my moves backwards.') : o.story ? T('Watch my moves, then copy them!') : T('Watch carefully!'));
    this.later(() => this.round(true), 1600);
  },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; this.phase = 'idle'; },
  say(t) { const s = $('#dSay'); if (s) s.textContent = t; },
  setFace(expr) { this.dancerEl.innerHTML = memberArt(this.dancerId, { expr }); },
  lock(b) { $('#dPads').classList.toggle('locked', b); },
  status() {
    let dots = '';
    for (let k = 0; k < this.p.target; k++) dots += '<i class="' + (k < this.seq.length ? (this.phase === 'input' && k < this.idx ? 'hit' : 'on') : '') + '"></i>';
    $('#dDots').innerHTML = dots;
    let h = '';
    for (let k = 0; k < this.p.lives; k++) h += '<span class="' + (k < this.lives ? '' : 'gone') + '">' + Art.icon('heart') + '</span>';
    $('#dLives').innerHTML = h;
  },
  rnd() { let m; const n = this.seq.length; do { m = rand(0, 3); } while (n >= 2 && this.seq[n - 1] === m && this.seq[n - 2] === m); return m; },
  round(first) {
    if (first) { while (this.seq.length < this.p.startLen) this.seq.push(this.rnd()); } else this.seq.push(this.rnd());
    this.play();
  },
  play() {
    this.phase = 'watch'; this.idx = 0; this.lock(true); this.status();
    this.say(T('Watch me!'));
    const sp = Math.max(400, this.p.speed - this.seq.length * 12);
    this.seq.forEach((m, k) => this.later(() => this.flash(m, sp * 0.55), 650 + k * sp));
    this.later(() => {
      this.phase = 'input'; this.lock(false); this.status();
      this.say(this.p.mirror ? T('Your turn, backwards!') : T('Your turn!'));
    }, 650 + this.seq.length * sp);
  },
  flash(m, dur) {
    const pad = this.padEls[m];
    if (pad) { pad.classList.add('lit'); setTimeout(() => pad.classList.remove('lit'), dur); }
    Sound.play('pad', m);
    const d = this.dancerEl;
    ['mv0', 'mv1', 'mv2', 'mv3'].forEach(c => d.classList.remove(c));
    void d.offsetWidth; d.classList.add('mv' + m);
    const pop = document.createElement('div'); pop.className = 'movepop'; pop.textContent = this.PADS[m].em;
    this.stageEl.appendChild(pop);
    setTimeout(() => { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 700);
  },
  press(m) {
    if (this.phase !== 'input') return;
    this.flash(m, 200);
    const n = this.seq.length;
    const want = this.p.mirror ? this.seq[n - 1 - this.idx] : this.seq[this.idx];
    if (m === want) {
      this.idx++; this.status();
      if (this.idx >= n) {
        this.phase = 'wait'; this.lock(true);
        this.setFace('joy');
        if (n >= this.p.target) { this.say(T('We did it!')); this.later(() => this.done(true), 800); }
        else { Sound.play('ding'); this.say(pick([T('Nice!'), T('Perfect!'), T('Daebak!'), T('So good!')]) + ' ' + T('One more move!')); this.later(() => { this.setFace('happy'); this.round(false); }, 1200); }
      }
    } else {
      this.mistakes++; this.lives--; this.phase = 'wait'; this.lock(true);
      Sound.play('error'); this.setFace('wow'); this.status();
      UI.retrigger(this.padEls[m], 'shake');
      if (this.lives <= 0) { this.say(T('Oh no!')); this.later(() => this.done(false), 1000); }
      else { this.say(T('Oops! Watch again.')); this.later(() => { this.setFace('happy'); this.play(); }, 1500); }
    }
  },
  done(win) {
    const m = this.mistakes;
    Game.finish(win, win ? (m === 0 ? 3 : m === 1 ? 2 : 1) : 0, { dances: 1 });
  }
};

/* ===================== Pattern Parade ===================== */
const PatternGame = {
  start(root, o) {
    this.o = o; this.root = root; this.timers = []; this.later = laterFor(this);
    const count = o.story ? STORY_CFG.pattern(o.tier).count : [5, 6, 6][o.tier];
    const pics = S.members.slice().concat(shuffle(Logic.PICS_EMOJI.slice()).slice(0, 4).map(e => 'e:' + e));
    this.qs = Logic.patternSet(o.tier, o.story ? 1 : o.level, pics, count);
    this.qi = 0; this.right = 0; this.locked = true;
    const host = o.story || S.members.indexOf('bao') >= 0 ? 'bao' : 'hazel';
    root.innerHTML = Game.header(o.story ? T('Bao\'s pattern test') : T(GAMES.pattern.name), o.level, o.story, '<span class="pill pq" id="pQ"></span>') +
      '<div class="coach">' + faceHTML(host) + '<span class="grow" id="pSay"></span></div>' +
      '<div class="parade" id="pParade"></div><div class="popts" id="pOpts"></div><div id="pRule"></div>';
    $('#pOpts').addEventListener('click', e => { const b = e.target.closest('.popt'); if (b) this.answer(+b.getAttribute('data-o'), b); });
    this.show();
  },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; this.locked = true; },
  tok(t, extra) {
    extra = extra || '';
    if (typeof t === 'number') return '<div class="ptok num ' + extra + '" style="--c:' + Art.candyColor((t % 10) + 1) + '">' + t + '</div>';
    if (t.indexOf('e:') === 0) return '<div class="ptok emo ' + extra + '">' + t.slice(2) + '</div>';
    return '<div class="ptok pic ' + extra + '">' + faceHTML(t, { acc: 'none' }) + '</div>';
  },
  optHTML(t) {
    if (typeof t === 'number') return String(t);
    if (t.indexOf('e:') === 0) return '<span style="font-size:40px;line-height:1">' + t.slice(2) + '</span>';
    return faceHTML(t, { acc: 'none' });
  },
  show() {
    const q = this.qs[this.qi], n = q.items.length;
    $('#pQ').textContent = (this.qi + 1) + ' / ' + this.qs.length;
    const par = $('#pParade');
    const avail = Math.max(200, par.clientWidth - 24);
    par.style.setProperty('--tk', Math.floor(Math.max(34, Math.min(56, (avail - (n - 1) * 8) / n))) + 'px');
    par.innerHTML = q.items.map((t, i) => (i === q.hide ? '<div class="ptok q" id="pHole">?</div>' : this.tok(t))).join('');
    $('#pOpts').innerHTML = q.options.map((t, i) => '<button class="popt" data-o="' + i + '">' + this.optHTML(t) + '</button>').join('');
    $('#pRule').innerHTML = '';
    $('#pSay').textContent = q.hide === n - 1 ? T('What comes next?') : T('Which one is missing?');
    this.locked = false;
  },
  answer(oi, btn) {
    if (this.locked) return;
    this.locked = true;
    const q = this.qs[this.qi], ok = q.options[oi] === q.answer;
    const hole = $('#pHole');
    if (hole) hole.outerHTML = this.tok(q.answer, 'filled');
    if (ok) {
      this.right++;
      btn.classList.add('good');
      Sound.play('ding');
      FX.burstAt(btn, { n: 12, kinds: ['star', 'heart'] });
      $('#pSay').textContent = pick([T('Yes!'), T('Correct!'), T('You got it!'), T('Boom-tss! Right!')]);
      this.rule(q, true);
      this.later(() => this.next(), 1900);
    } else {
      btn.classList.add('bad');
      Sound.play('error');
      $$('.popt', this.root).forEach((b, i) => { if (q.options[i] === q.answer) b.classList.add('good'); else if (b !== btn) b.classList.add('dim'); });
      $('#pSay').textContent = T('Not quite! Here\'s the trick:');
      this.rule(q, false);
    }
  },
  rule(q, auto) {
    $('#pRule').innerHTML = '<div class="prule">' + esc(q.rule) + (auto ? '' : '<br><button class="btn small mint" id="pNext">' + T('Got it') + '</button>') + '</div>';
    if (!auto) $('#pNext').addEventListener('click', () => { Sound.play('tap'); this.next(); });
  },
  next() {
    this.qi++;
    if (this.qi >= this.qs.length) {
      const n = this.qs.length, r = this.right;
      const stars = r === n ? 3 : r >= n - 1 ? 2 : r >= Math.ceil(n / 2) ? 1 : 0;
      Game.finish(stars > 0, stars, { patterns: r });
      return;
    }
    this.show();
  }
};

    this.gridEl = $('#sGrid'); this.wrapEl = $('#sWrap');
    $('#sPal').innerHTML = this.syms.map((s, v) => '<button data-v="' + v + '" aria-label="' + (MEMBERS[s] ? MEMBERS[s].name : T('guest')) + '">' + this.symHTML(v, false) + '</button>').join('') +
      '<button data-v="-1" aria-label="' + T('Erase') + '" style="font-size:24px;font-weight:700">✕</button>';
    $('#sPal').addEventListener('click', e => { const b = e.target.closest('button'); if (b) this.put(+b.getAttribute('data-v')); });
    this.gridEl.addEventListener('click', e => { const c = e.target.closest('.scell'); if (c) this.tap(+c.getAttribute('data-i')); });
    $('#sHint').addEventListener('click', () => this.hint());
    this._rs = () => this.layout();
    window.addEventListener('resize', this._rs);
    this.layout();
    this.render();
  },
  stop() { this.over = true; this.timers.forEach(clearTimeout); this.timers = []; window.removeEventListener('resize', this._rs); },
  layout() {
    const W = this.wrapEl.clientWidth - 16, H = this.wrapEl.clientHeight - 16;
    const sc = Math.floor(Math.max(40, Math.min((W - 8) / this.n, (H - 8) / this.n, 84)));
    this.gridEl.style.setProperty('--sc', sc + 'px');
    this.gridEl.style.setProperty('--n', this.n);
  },
  symHTML(v, put) {
    const s = this.syms[v];
    if (MEMBERS[s]) return '<span class="face' + (put ? ' put' : '') + '" style="--c:' + MEMBERS[s].color + '">' + memberArt(s, { head: true, acc: 'none' }) + '</span>';
    return '<span class="emo' + (put ? ' face put' : '') + '"' + (put ? ' style="--c:#fff;border:0"' : '') + '>' + s + '</span>';
  },
  cellEl(i) { return this.gridEl.querySelector('[data-i="' + i + '"]'); },
  render() {
    const n = this.n, br = this.pz.br, bc = this.pz.bc;
    const bad = Logic.sudokuConflicts(this.grid, n, br, bc);
    const sr = this.sel >= 0 ? (this.sel / n) | 0 : -9, sc = this.sel >= 0 ? this.sel % n : -9;
    let h = '';
    for (let i = 0; i < n * n; i++) {
      const r = (i / n) | 0, c = i % n;
      let cls = 'scell';
      if ((c + 1) % bc === 0) cls += c === n - 1 ? ' eR' : ' bR';
      if ((r + 1) % br === 0) cls += r === n - 1 ? ' eB' : ' bB';
      if (this.given[i]) cls += ' given';
      if (i === this.sel) cls += ' sel';
      else if (r === sr || c === sc || (Math.floor(r / br) === Math.floor(sr / br) && Math.floor(c / bc) === Math.floor(sc / bc))) cls += ' hl';
      if (bad[i]) cls += ' bad';
      h += '<div class="' + cls + '" data-i="' + i + '">' + (this.grid[i] >= 0 ? this.symHTML(this.grid[i], i === this.lastPut) : '') + '</div>';
    }
    this.gridEl.innerHTML = h;
    this.lastPut = -1;
  },
  tap(i) {
    if (this.over) return;
    if (this.given[i]) {
      if (!this.toldGiven) { this.toldGiven = true; UI.toast(T('The squares with a purple background are already set.')); }
      UI.retrigger(this.cellEl(i), 'shake');
      return;
    }
    this.sel = i;
    Sound.play('tap');
    this.render();
  },
  put(v) {
    if (this.over) return;
    if (this.sel < 0) { UI.toast(T('First tap an empty square, then pick who goes there.')); return; }
    const i = this.sel;
    if (this.given[i]) return;
    if (v === -1) { if (this.grid[i] >= 0) { this.grid[i] = -1; Sound.play('whoosh'); this.render(); } return; }
    if (this.grid[i] === v) return;
    this.grid[i] = v; this.lastPut = i;
    const bad = Logic.sudokuConflicts(this.grid, this.n, this.pz.br, this.pz.bc);
    if (bad[i]) { this.mistakes++; Sound.play('error'); UI.toast(pick([T('Oops! They\'re already in that row, column or box.'), T('Two of the same can\'t share a row, column or box!')])); }
    else Sound.play('place');
    this.render();
    this.check();
  },
  check() {
    if (this.grid.some(v => v < 0)) return;
    if (Object.keys(Logic.sudokuConflicts(this.grid, this.n, this.pz.br, this.pz.bc)).length) { UI.toast(T('Almost! Fix the red squares.')); return; }
    this.over = true;
    this.later(() => {
      const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f);
      setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 600);
      Sound.play('camera');
      FX.burstAt(this.gridEl, { n: 30 });
      this.later(() => { const m = this.mistakes; Game.finish(true, m === 0 ? 3 : m <= 2 ? 2 : 1, { photos: 1 }); }, 800);
    }, 350);
  },
  hint() {
    if (this.over) return;
    if (this.hints <= 0) { UI.toast(T('No hints left. You can do it!')); return; }
    const wrong = [];
    this.grid.forEach((v, k) => { if (!this.given[k] && v !== this.pz.sol[k]) wrong.push(k); });
    if (!wrong.length) return;
    const i = wrong.indexOf(this.sel) >= 0 ? this.sel : pick(wrong);
    this.hints--; this.mistakes++;
    $('#sHintN').textContent = this.hints;
    this.grid[i] = this.pz.sol[i]; this.sel = i; this.lastPut = i;
    Sound.play('sparkle');
    this.render();
    FX.burstAt(this.cellEl(i), { n: 10, kinds: ['star'] });
    this.check();
  }
};

/* ===================== Stage Clues (logic line-up) ===================== */
const CluesGame = {
  start(root, o) {
    this.o = o; this.root = root; this.timers = []; this.later = laterFor(this);
    const p = o.story ? STORY_CFG.lineup(o.tier) : Logic.lineupParams(o.tier, o.level);
    const k = Math.min(p.k, S.members.length);
    this.cast = shuffle(S.members.slice()).slice(0, k);
    this.pz = Logic.lineup(k, o.tier);
    this.k = k; this.slots = new Array(k).fill(-1);
    this.sel = null; this.mistakes = 0; this.over = false; this.checked = false; this.live = o.tier === 0; this.toldTap = false;
    root.innerHTML = Game.header(o.story ? T('The secret letter') : T(GAMES.lineup.name), o.level, o.story) +
      '<div class="lstage"><div class="slots" id="lSlots"></div></div><div class="lr"><span>← ' + T('Left') + '</span><span>' + T('Right') + ' →</span></div>' +
      '<div class="pool" id="lPool"></div><div class="clues" id="lClues"></div><div class="morehint" id="lMore">▼ ' + T('more clues below') + ' ▼</div>' +
      '<div class="lfoot"><button class="btn white small" id="lClear">' + T('Start over') + '</button><button class="btn pink" id="lCheck">' + T('Check') + '</button></div>';
    root.querySelector('.lstage').addEventListener('click', e => { const s = e.target.closest('.slot'); if (s) this.tapSlot(+s.getAttribute('data-s')); });
    $('#lPool').addEventListener('click', e => {
      const t = e.target.closest('.tok');
      if (t) this.tapTok(+t.getAttribute('data-m'));
      else if (this.sel && this.sel.from === 'slot') { this.slots[this.sel.s] = -1; this.sel = null; Sound.play('whoosh'); this.changed(); }
    });
    $('#lClear').addEventListener('click', () => { if (this.over) return; Sound.play('whoosh'); this.slots.fill(-1); this.sel = null; this.changed(); });
    $('#lClues').addEventListener('scroll', () => this.moreCue(), { passive: true });
    $('#lCheck').addEventListener('click', () => this.check());
    this._rs = () => { this.layout(); this.moreCue(); };
    window.addEventListener('resize', this._rs);
    this.layout();
    this.render();
  },
  stop() { this.over = true; this.timers.forEach(clearTimeout); this.timers = []; window.removeEventListener('resize', this._rs); },
  layout() {
    const W = Math.min(this.root.clientWidth, 520) - 40;
    $('#lSlots').style.setProperty('--sw', Math.floor(Math.min(80, (W - (this.k - 1) * 7) / this.k)) + 'px');
  },
  chip(mi) { const id = this.cast[mi]; return '<span class="chip">' + faceHTML(id, { acc: 'none' }) + esc(MEMBERS[id].name) + '</span>'; },
  clueText(cl) {
    const A = this.chip(cl.a), B = cl.b != null ? this.chip(cl.b) : '', C = cl.c != null ? this.chip(cl.c) : '', k = this.k;
    const mid = p => k % 2 === 1 && p === (k - 1) / 2;
    const p = cl.p, n = p + 1;
    switch (cl.t) {
      case 'at': return p === 0 ? T('{A} is first (far left).', { A }) : p === k - 1 ? T('{A} is last (far right).', { A }) : mid(p) ? T('{A} is in the middle.', { A }) : T('{A} is in spot {n}.', { A, n });
      case 'notAt': return p === 0 ? T('{A} is <b>not</b> first.', { A }) : p === k - 1 ? T('{A} is <b>not</b> last.', { A }) : mid(p) ? T('{A} is <b>not</b> in the middle.', { A }) : T('{A} is <b>not</b> in spot {n}.', { A, n });
      case 'left': return T('{A} is somewhere to the left of {B}.', { A, B });
      case 'right': return T('{A} is somewhere to the right of {B}.', { A, B });
      case 'justLeft': return T('{A} is next to {B}, on the left side.', { A, B });
      case 'next': return T('{A} is next to {B}.', { A, B });
      case 'notNext': return T('{A} is <b>not</b> next to {B}.', { A, B });
      case 'end': return T('{A} is at one of the ends.', { A });
      case 'notEnd': return T('{A} is <b>not</b> at either end.', { A });
      case 'between': return T('{A} is somewhere between {B} and {C}.', { A, B, C });
      default: return '';
    }
  },
  render(justChecked) {
    const k = this.k, sel = this.sel;
    $('#lSlots').innerHTML = this.slots.map((mi, s) => '<div class="slot' + (mi >= 0 ? ' filled' : '') +
      (sel && sel.from === 'slot' && sel.s === s ? ' sel' : '') + (sel && sel.from === 'pool' && mi < 0 ? ' target' : '') + '" data-s="' + s + '">' +
      (mi >= 0 ? memberArt(this.cast[mi], { mic: false }) : '') + '<span class="no">' + (s + 1) + '</span></div>').join('');
    const waiting = range(k).filter(mi => this.slots.indexOf(mi) < 0);
    $('#lPool').innerHTML = waiting.length
      ? waiting.map(mi => '<div class="tok' + (sel && sel.from === 'pool' && sel.mi === mi ? ' sel' : '') + '" data-m="' + mi + '">' + faceHTML(this.cast[mi], { acc: 'none' }) + esc(MEMBERS[this.cast[mi]].name) + '</div>').join('')
      : '<span class="empty">' + (sel && sel.from === 'slot' ? T('Tap here to take them off the stage.') : T('Everyone is on stage! Tap Check.')) + '</span>';
    const pos = [];
    this.slots.forEach((mi, s) => { if (mi >= 0) pos[mi] = s; });
    $('#lClues').innerHTML = this.pz.clues.map((cl, i) => {
      let mark = '', cls = 'clue';
      if (this.live || this.checked) {
        const inv = [cl.a, cl.b, cl.c].filter(x => x != null);
        if (inv.every(mi => pos[mi] != null)) {
          const ok = Logic.clueTrue(cl, pos, k);
          mark = ok ? '✅' : '❌';
          cls += ok ? ' ok' : (justChecked ? ' bad' : ' wrong');
        }
      }
      return '<div class="' + cls + '"><span class="no">' + (i + 1) + '</span><span>' + this.clueText(cl) + '</span><span class="mark">' + mark + '</span></div>';
    }).join('');
    $('#lCheck').disabled = waiting.length > 0 || this.over;
    this.moreCue();
  },
  moreCue() {
    const c = $('#lClues'), h = $('#lMore');
    if (!c || !h) return;
    const more = c.scrollTop + c.clientHeight < c.scrollHeight - 6;
    c.classList.toggle('more', more);
    h.classList.toggle('on', more);
  },
  tapTok(mi) {
    if (this.over) return;
    this.sel = this.sel && this.sel.from === 'pool' && this.sel.mi === mi ? null : { from: 'pool', mi };
    Sound.play('pick');
    this.render();
    if (this.sel && !this.toldTap) { this.toldTap = true; UI.toast(T('Now tap a spot on the stage!')); }
  },
  tapSlot(s) {
    if (this.over) return;
    const occ = this.slots[s], sel = this.sel;
    if (sel) {
      if (sel.from === 'pool') this.slots[s] = sel.mi;
      else if (sel.s === s) { this.sel = null; this.render(); return; }
      else { this.slots[sel.s] = occ; this.slots[s] = sel.mi; }
      this.sel = null; Sound.play('place'); this.changed();
    } else if (occ >= 0) { this.sel = { from: 'slot', s, mi: occ }; Sound.play('pick'); this.render(); }
    else UI.toast(T('Tap a friend first, then tap a spot.'));
  },
  changed() { this.checked = false; this.render(); },
  check() {
    if (this.over || this.slots.indexOf(-1) >= 0) return;
    const pos = [];
    this.slots.forEach((mi, s) => { pos[mi] = s; });
    if (this.pz.clues.every(cl => Logic.clueTrue(cl, pos, this.k))) {
      this.over = true; this.checked = true; this.render();
      Sound.play('fanfare');
      FX.burstAt($('#lSlots'), { n: 30 });
      this.later(() => { const m = this.mistakes; Game.finish(true, m === 0 ? 3 : m === 1 ? 2 : 1, { clues: 1 }); }, 1000);
    } else {
      this.mistakes++; this.checked = true;
      Sound.play('error');
      this.render(true);
      UI.toast(T('Some clues don\'t match yet. Look for the ❌.'));
    }
  }
};

    { s: 'hazel', t: 'The biggest stage ever! And our fans ordered a GIANT pile of candy.', m: 'wow' },

    { game: 'merge', cfg: 'merge6' },

const BG_DECOR = {
  academy: '<i class="mirror"></i><i class="barre"></i><i class="planks"></i>',
  park: '<i class="sun"></i><i class="hill"></i><i class="hill2"></i><i class="tree a"></i><i class="tree b"></i>',
  stage: '<i class="beam a"></i><i class="beam b"></i><i class="beam c"></i><i class="crowd"></i>',
  studio: '<i class="soft a"></i><i class="soft b"></i>',
  night: '<i class="city"></i>'
};

const Story = {
  queue: [], cast: [], speaker: null, waiting: null, typing: false, full: '', typer: null, lastLine: null, gameIdx: -1, timers: [],
  ready() { return S.chapter < CHAPTERS.length && S.fans >= CHAPTERS[S.chapter].fans; },
  begin() {
    if (!this.ready()) return;
    const ch = CHAPTERS[S.chapter];
    const from = Math.min(S.chapterStep || 0, ch.steps.length);
    this.queue = ch.steps.slice(from).map((st, k) => Object.assign({ _i: from + k }, st));
    this.cast = []; this.speaker = null; this.lastLine = null; this.waiting = null;
    this.clearTimers();
    let bg = ch.bg;
    ch.steps.slice(0, from).forEach(st => { if (st.bg) bg = st.bg; });
    this.setBg(bg);
    UI.closeAll();
    UI.show('scr-story');
    Music.start('full');
    this.renderCast();
    $('#dBox').innerHTML = '';
    this.titleCard(ch);
  },
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; clearInterval(this.typer); this.typing = false; },
  after(fn, ms) { this.timers.push(setTimeout(() => { if (UI.current === 'scr-story') fn(); }, ms)); },
  titleCard(ch) {
    const ov = $('#sOverlay');
    ov.innerHTML = '<div class="chcard"><small>' + T('Chapter {n}', { n: S.chapter + 1 }) + '</small><h2>' + esc(T(ch.title)) + '</h2></div>';
    this.waiting = 'card';
    Sound.play('sparkle');
    this.after(() => { if (this.waiting === 'card') this.closeCard(); }, 2000);
  },
  closeCard() { $('#sOverlay').innerHTML = ''; this.waiting = null; this.next(); },
  setBg(kind) { const b = $('#sBg'); b.className = 'sbg bg-' + kind; b.innerHTML = BG_DECOR[kind] || ''; },
  next() {
    const st = this.queue.shift();
    if (!st) { this.complete(); return; }
    if (st.s) this.say(st);
    else if (st.choice) this.choice(st);
    else if (st.tierChoice) this.tierChoice();
    else if (st.input) this.input();
    else if (st.game) this.game(st);
    else if (st.recruit) this.recruit(st.recruit);
    else if (st.unlock) { if (S.games.indexOf(st.unlock) < 0) S.games.push(st.unlock); Store.save(); this.next(); }
    else if (st.reward) this.reward(st.reward);
    else if (st.bg) { this.setBg(st.bg); Sound.play('whoosh'); this.cast = []; this.renderCast(); this.after(() => this.next(), 450); }
    else if (st.fx) this.fx(st.fx);
    else this.next();
  },
  enter(id, mood) {
    let a = null;
    this.cast.forEach(c => { if (c.id === id) a = c; });
    if (!a) {
      if (this.cast.length >= 3) {
        let old = 0;
        this.cast.forEach((c, i) => { if (c.t < this.cast[old].t) old = i; });
        this.cast.splice(old, 1);
      }
      a = { id, fresh: true, t: 0 };
      this.cast.push(a);
    }
    a.mood = mood || 'happy'; a.t = Date.now();
    this.speaker = id;
    this.renderCast();
  },
  renderCast() {
    $('#sCast').innerHTML = this.cast.map(a => '<div class="actor' + (a.id === this.speaker ? ' talk' : ' quiet') + (a.fresh ? ' enter' : '') + '">' + memberArt(a.id, { expr: a.mood }) + '</div>').join('');
    this.cast.forEach(a => { a.fresh = false; });
  },
  nameTag(id) { const info = speakerInfo(id); return '<div class="dname" style="--c:' + info.color + '">' + esc(id === 'hoot' ? T(info.name) : info.name) + '</div>'; },
  say(st) {
    this.enter(st.s, st.m);
    this.full = fillText(T(st.t));
    this.lastLine = { id: st.s, text: this.full };
    $('#dBox').innerHTML = this.nameTag(st.s) + '<div class="dtext" id="dText"></div><div class="dnext" id="dNext" style="visibility:hidden">▼</div>';
    this.waiting = 'tap';
    this.type(speakerInfo(st.s).voice);
  },
  type(voice) {
    const el = $('#dText'), chars = Array.from(this.full);
    let i = 0;
    this.typing = true;
    clearInterval(this.typer);
    this.typer = setInterval(() => {
      i++;
      el.textContent = chars.slice(0, i).join('');
      if (i % 2 === 0 && /[\p{L}\p{N}]/u.test(chars[i - 1] || '')) Sound.play('blip', voice);
      if (i >= chars.length) this.endType();
    }, 26);
  },
  endType() {
    clearInterval(this.typer); this.typing = false;
    const el = $('#dText'); if (el) el.textContent = this.full;
    const nx = $('#dNext'); if (nx) nx.style.visibility = 'visible';
  },
  tap() {
    if (this.waiting === 'card') { this.closeCard(); return; }
    if (this.waiting !== 'tap') return;
    if (this.typing) { this.endType(); return; }
    this.waiting = null;
    this.next();
  },
  question() {
    if (!this.lastLine) return '';
    return this.nameTag(this.lastLine.id) + '<div class="dtext q">' + esc(this.lastLine.text) + '</div>';
  },
  choice(st) {
    this.waiting = 'choice';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dchoices">' + st.choice.map((c, i) => '<button class="btn white" data-c="' + i + '">' + esc(fillText(T(c.t))) + '</button>').join('') + '</div>';
    $$('[data-c]', box).forEach(b => b.addEventListener('click', () => {
      if (this.waiting !== 'choice') return;
      this.waiting = null;
      const c = st.choice[+b.getAttribute('data-c')];
      Sound.play('sparkle');
      if (c.set) Object.keys(c.set).forEach(k => { S[k] = c.set[k]; });
      if (c.flag) S.flags[c.flag] = true;
      Store.save();
      if (c.set && c.set.concept) { this.renderCast(); FX.burstAt($('#sCast'), { n: 30 }); }
      if (c.then) this.queue = c.then.concat(this.queue);
      this.next();
    }));
  },
  tierChoice() {
    this.waiting = 'choice';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dchoices">' + TIERS.map((t, i) => '<button class="btn white" data-t="' + i + '"><span style="font-size:26px">' + t.icon + '</span><span><b>' + T(t.name) + '</b><br><small style="font-weight:500">' + T(t.desc) + '</small></span></button>').join('') + '</div>';
    $$('[data-t]', box).forEach(b => b.addEventListener('click', () => {
      if (this.waiting !== 'choice') return;
      this.waiting = null;
      S.tier = +b.getAttribute('data-t'); Store.save();
      Sound.play('sparkle');
      this.next();
    }));
  },
  input() {
    this.waiting = 'input';
    const box = $('#dBox');
    box.innerHTML = this.question() + '<div class="dinput"><input id="nameIn" maxlength="14" placeholder="' + T('Type your name') + '" autocomplete="off" autocapitalize="words" enterkeyhint="done"><button class="btn pink" id="nameOk">' + T('OK') + '</button></div>';
    const inp = $('#nameIn');
    const go = () => {
      if (this.waiting !== 'input') return;
      this.waiting = null;
      S.name = inp.value.trim().replace(/\s+/g, ' ').slice(0, 14) || T('Star');
      Store.save(); inp.blur();
      Sound.play('sparkle');
      this.next();
    };
    $('#nameOk').addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  },
  game(st) {
    if (st._i != null) { S.chapterStep = st._i; this.gameIdx = st._i; Store.save(); }
    this.clearTimers();
    Game.launch(st.game, { story: true, cfg: st.cfg });
  },
  gameWon() {
    if (this.gameIdx >= 0) { S.chapterStep = this.gameIdx + 1; this.gameIdx = -1; Store.save(); }
  },
  resume() {
    UI.closeAll();
    UI.show('scr-story');
    Music.start('full');
    this.renderCast();
    $('#dBox').innerHTML = '';
    this.next();
  },
  exit() {
    this.clearTimers();
    this.waiting = null;
    Screens.hub();
  },
  askExit() {
    UI.ask({
      title: T('Leave the story?'), text: T('You can come back to this chapter any time from the studio.'),
      buttons: [{ label: T('Keep reading'), cls: 'white' }, { label: T('Leave'), cls: 'pink', fn: () => this.exit() }]
    });
  },
  recruit(id) {
    if (S.members.indexOf(id) < 0) S.members.push(id);
    Store.save();
    this.enter(id, 'joy');
    Sound.play('fanfare');
    FX.rain(70);
    this.lastLine = { id, text: T('{who} joined Twinkle Tails!', { who: MEMBERS[id].name }) };
    $('#dBox').innerHTML = '<div class="dname" style="--c:' + MEMBERS[id].color + '">' + T('New member!') + '</div><div class="dtext">' + T('{who} joined Twinkle Tails!', { who: esc(MEMBERS[id].name) }) + ' 🎉</div><div class="dnext">▼</div>';
    this.typing = false; this.waiting = 'tap';
  },
  reward(r) {
    if (r.hearts) S.hearts += r.hearts;
    const card = r.card && S.cards.indexOf(r.card) < 0 ? r.card : null;
    if (card) S.cards.push(card);
    Store.save();
    Sound.play('buy');
    FX.burstAt($('#dBox'), { n: 24, kinds: ['heart'], colors: ['#FF8FC4', '#FF5C8E', '#FFFFFF'] });
    $('#dBox').innerHTML = '<div class="dname" style="--c:#FFD65C">' + T('Reward') + '</div><div class="dtext">' + (card ? T('You got {n} hearts and a shiny Dream Idol photocard!', { n: r.hearts }) : T('You got {n} hearts!', { n: r.hearts })) + ' 💖</div><div class="dnext">▼</div>';
    this.typing = false; this.waiting = 'tap';
  },
  fx(kind) {
    if (kind === 'drum') Sound.play('drum');
    else if (kind === 'camera') {
      Sound.play('camera');
      const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f);
      setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 600);
    } else if (kind === 'fanfare') { Sound.play('fanfare'); FX.rain(90); }
    this.after(() => this.next(), kind === 'drum' ? 1100 : 500);
  },
  complete() {
    const done = S.chapter;
    S.chapter = done + 1; S.chapterStep = 0;
    if (S.chapter >= CHAPTERS.length) S.finished = true;
    Store.save();
    this.waiting = null;
    if (S.chapter >= CHAPTERS.length) { Screens.hub(); this.finale(); return; }
    const nx = CHAPTERS[S.chapter];
    const text = S.fans >= nx.fans ? T('Next up: "{title}". It\'s ready to play right now!', { title: esc(T(nx.title)) })
      : T('Next up: "{title}". It opens when you have {need} {fandom}. You have {have}, so you need {more} more. Win practice games to get them!', { title: esc(T(nx.title)), need: nx.fans, fandom: esc(S.fandom), have: S.fans, more: nx.fans - S.fans });
    Sound.play('win');
    UI.ask({ art: memberArt(pick(S.members), { expr: 'joy' }), title: T('Chapter {n} complete!', { n: done + 1 }), text, dismiss: false,
      buttons: [{ label: T('Back to the studio'), cls: 'pink', fn: () => Screens.hub() }] });
  },
  finale() {
    const crew = MEMBER_ORDER.map(id => '<div style="width:31%">' + memberArt(id, { expr: 'joy' }) + '</div>').join('');
    FX.rain(140);
    Sound.play('fanfare');
    UI.ask({ html: '<div style="display:flex;flex-wrap:wrap;justify-content:center;margin:-4px 0 4px">' + crew + '</div>', title: T('The end... for now!'),
      text: T('Thank you, Producer {name}! Keep playing to level up, try harder puzzles and collect every photocard.', { name: esc(S.name || '') }),
      buttons: [{ label: T('Back to the studio'), cls: 'pink' }], dismiss: false });
  }
};

/* ===================== SCREENS ===================== */
const Screens = {
  styleSel: null, sayT: null,
  pills() {
    return '<span class="pill pill-hearts" aria-label="' + T('Hearts') + '">' + Art.icon('heart') + S.hearts + '</span>' +
      '<span class="pill pill-fans" aria-label="' + esc(S.fandom) + '">' + Art.icon('lightstick') + S.fans + '</span>';
  },
  top(title) {
    return '<div class="topbar"><button class="ibtn" data-act="hub" aria-label="' + T('Back to the studio') + '">' + Art.icon('back') + '</button>' +
      '<div class="grow"><h2>' + title + '</h2></div><span class="pill pill-hearts">' + Art.icon('heart') + S.hearts + '</span></div>';
  },

  /* ---------- title ---------- */
  title() {
    UI.closeAll();
    const spots = [
      { id: 'bao', l: 4, b: 38, w: 27 }, { id: 'maple', l: 36.5, b: 43, w: 27 }, { id: 'miso', l: 69, b: 38, w: 27 },
      { id: 'hazel', l: 0, b: 0, w: 32 }, { id: 'lulu', l: 34, b: 0, w: 32 }, { id: 'stella', l: 68, b: 0, w: 32 }
    ];
    $('#scr-title').innerHTML = '<div class="t-logo"><h1 class="logo">' + logoHTML('Twinkle') + '<br>' + logoHTML('Tails') + '</h1></div>' +
      '<p class="t-sub">' + T('A puzzle adventure with an idol group of animals') + '</p>' +
      '<div class="t-crew">' + spots.map(p => '<div class="m" style="left:' + p.l + '%;bottom:' + p.b + '%;width:' + p.w + '%"><div class="bob" style="animation-delay:-' + (Math.random() * 2.6).toFixed(2) + 's">' +
        Art.member(p.id, { concept: S.started ? S.concept : 'candy', acc: S.wear[p.id] || 'none', expr: p.id === 'lulu' ? 'joy' : 'happy' }) + '</div></div>').join('') + '</div>' +
      '<button class="btn pink big" data-act="start">' + (S.started ? T('Continue') : T('Start')) + '</button>' +
      '<div class="t-lang">' + LANGS.map(l => '<button class="' + (S.lang === l.id ? 'on' : '') + '" data-act="lang" data-id="' + l.id + '">' + l.name + '</button>').join('') + '</div>' +
      (Store.ok ? '' : '<p class="t-note">' + T('This browser can\'t save progress here. Open the game from a web address to keep your stars.') + '</p>');
    UI.show('scr-title');
  },

  /* ---------- hub ---------- */
  order() {
    const front = ['hazel', 'lulu', 'stella'].filter(m => S.members.indexOf(m) >= 0);
    const back = ['bao', 'maple', 'miso'].filter(m => S.members.indexOf(m) >= 0);
    return back.length ? [back, front] : [front];
  },
  hub() {
    UI.closeAll();
    const st = STAGES.find(s => s.id === S.stage) || STAGES[0];
    const rows = this.order();
    const deco = range(7).map(i => '<span class="deco" style="left:' + (6 + i * 13 + Math.random() * 6).toFixed(1) + '%;bottom:' + (10 + Math.random() * 40).toFixed(0) + '%;animation-delay:-' + (Math.random() * 11).toFixed(1) + 's">' + st.deco[i % st.deco.length] + '</span>').join('');
    const troupe = '<div class="troupe" id="troupe">' + rows.map((r, ri) => '<div class="row' + (rows.length > 1 && ri === 0 ? ' back' : '') + '">' +
      r.map(id => '<div class="mem" data-mem="' + id + '"><div class="bob" style="animation-delay:-' + (Math.random() * 2.6).toFixed(2) + 's">' + memberArt(id) + '</div></div>').join('') + '</div>').join('') + '</div>';
    const newGame = S.games.some(g => !S.seen[g]);
    $('#scr-hub').innerHTML =
      '<div class="topbar"><div class="grow hello">' + T('Producer {name}', { name: esc(S.name || '') }) + '</div>' + this.pills() +
      '<button class="ibtn" data-act="settings" aria-label="' + T('Settings') + '">' + Art.icon('gear') + '</button></div>' +
      '<div class="stage st-' + S.stage + '" id="hubStage"><div class="spot l"></div><div class="spot r"></div>' +
      '<div class="marquee"><h1 class="logo">' + logoHTML(GROUP) + '</h1></div><div class="floor"></div>' + deco + troupe + '</div>' +
      this.storyCard() +
      '<div class="nav"><button class="btn mint rel" data-act="practice"><span class="em">🎮</span>' + T('Practice') + (newGame ? '<span class="badge">' + T('New') + '</span>' : '') + '</button>' +
      '<button class="btn lilac" data-act="cards"><span class="em">🃏</span>' + T('Photocards') + '</button>' +
      '<button class="btn" data-act="style"><span class="em">🎀</span>' + T('Style') + '</button></div>';
    UI.show('scr-hub');
    Music.start('full');
    this.layoutTroupe();
  },
  layoutTroupe() {
    const stage = $('#hubStage');
    if (!stage) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    const rows = $$('#troupe .row', stage);
    const perRow = Math.max.apply(null, rows.map(r => r.children.length));
    let w = Math.min((W - 16) / perRow, perRow <= 2 ? 168 : 134);
    const ratio = 154 / 120;
    const maxH = rows.length === 1 ? H - 74 : (H - 64) / 1.62;
    w = Math.max(40, Math.min(w, maxH / ratio));
    rows.forEach((r, ri) => {
      const ww = rows.length === 2 && ri === 0 ? w * 0.86 : w;
      $$('.mem', r).forEach(m => { m.style.width = Math.floor(ww) + 'px'; });
    });
  },
  storyCard() {
    if (S.chapter >= CHAPTERS.length) {
      return '<div class="story-card"><div class="book">🏆</div><div class="txt"><div class="ch">' + T('Story complete') + '</div><h3>' + T('Twinkle Tails are superstars!') + '</h3><div class="need">' + T('Keep leveling up and collect every photocard.') + '</div></div></div>';
    }
    const ch = CHAPTERS[S.chapter], ready = S.fans >= ch.fans;
    const pct = ch.fans ? Math.min(100, Math.round(S.fans / ch.fans * 100)) : 100;
    return '<div class="story-card' + (ready ? ' ready' : '') + '" data-act="story" role="button" tabindex="0"><div class="book">📖</div><div class="txt">' +
      '<div class="ch">' + T('Chapter {n} of {total}', { n: S.chapter + 1, total: CHAPTERS.length }) + '</div><h3>' + esc(T(ch.title)) + '</h3>' +
      (ready ? '<div class="need">' + (S.chapterStep > 0 ? T('Tap to continue the story!') : T('Ready! Tap to play.')) + '</div>'
        : '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="need">' + T('{n} more {fandom} needed. Practice to get more!', { n: ch.fans - S.fans, fandom: esc(S.fandom) }) + '</div>') +
      '</div></div>';
  },
  memberTap(id, el) {
    const m = MEMBERS[id];
    if (!m) return;
    UI.retrigger(el, 'jump');
    for (let i = 0; i < 5; i++) setTimeout(() => Sound.play('blip', m.voice), i * 70);
    const stage = $('#hubStage');
    if (!stage) return;
    const old = $('.stage-say', stage);
    if (old) old.parentNode.removeChild(old);
    const say = document.createElement('div');
    say.className = 'stage-say';
    say.innerHTML = faceHTML(id) + '<span>' + esc(fillText(T(pick(m.lines)))) + '</span>';
    stage.appendChild(say);
    clearTimeout(this.sayT);
    this.sayT = setTimeout(() => { if (say.parentNode) say.parentNode.removeChild(say); }, 3400);
    FX.burstAt(el, { n: 8, kinds: ['heart'], speed: 3 });
  },

  /* ---------- practice ---------- */
  practice() {
    UI.closeAll();
    const t = TIERS[S.tier];
    $('#scr-practice').innerHTML = this.top(T('Practice room')) +
      '<div class="tierline"><span>' + T('Puzzle level:') + ' ' + t.icon + ' ' + T(t.name) + '</span><button class="btn small white" data-act="settings">' + T('Change') + '</button></div>' +
      '<div class="scroll"><div class="glist">' + GAME_ORDER.map(id => this.gameCard(id)).join('') + '</div></div>';
    UI.show('scr-practice');
    Music.start('full');
  },
  gameCard(id) {
    const g = GAMES[id];
    if (S.games.indexOf(id) < 0) {
      let chIdx = 0;
      CHAPTERS.forEach((c, i) => { if (c.steps.some(st => st.unlock === id)) chIdx = i; });
      return '<div class="gcard locked"><div class="gi" style="background:' + g.bg + '">' + g.icon + '</div><div class="gt"><b>' + T(g.name) + '</b>' +
        '<span class="gd">' + T('Unlocks in chapter {n} of the story.', { n: chIdx + 1 }) + '</span></div>' + Art.icon('lock') + '</div>';
    }
    return '<button class="gcard" data-act="play" data-game="' + id + '"><div class="gi" style="background:' + g.bg + '">' + g.icon + '</div>' +
      '<div class="gt"><b>' + T(g.name) + '</b><span class="gd">' + T(g.desc) + '</span><span class="gs">' + T(g.skill) + '</span></div>' +
      '<div class="glv">' + T('Level') + '<big>' + S.level[id] + '</big></div>' + (!S.seen[id] ? '<span class="badge">' + T('New') + '</span>' : '') + '</button>';
  },

  /* ---------- photocards ---------- */
  cardArt(id, c) { return Art.member(id, { concept: c.outfit, expr: c.expr, acc: c.acc, mic: false }); },
  cards() {
    UI.closeAll();
    const total = MEMBER_ORDER.length * CONCEPTS.length;
    let html = this.top(T('Photocards')) + '<div class="cards-sub">' + T('{n} of {total} collected. Tap a card to see it or collect it.', { n: S.cards.length, total }) + '</div><div class="scroll">';
    MEMBER_ORDER.forEach(id => {
      const known = S.members.indexOf(id) >= 0;
      html += '<div class="cgroup"><h3>' + (known ? faceHTML(id) + esc(MEMBERS[id].name) : '<span class="face" style="--c:#EEE8F4;font-size:18px">?</span>' + T('Secret member')) + '</h3><div class="cards-grid">' +
        CONCEPTS.map(c => {
          const cid = id + '-' + c.id, owned = S.cards.indexOf(cid) >= 0;
          if (!known) return '<div class="pcard pc-' + c.id + ' not"><div class="tag">🔒</div></div>';
          return '<div class="pcard pc-' + c.id + (owned ? '' : ' not') + (c.shiny ? ' shiny' : '') + '" data-card="' + cid + '"><div class="pa">' + this.cardArt(id, c) + '</div>' +
            (owned ? '' : '<div class="tag">' + Art.icon('heart') + c.price + '</div>') + '</div>';
        }).join('') + '</div></div>';
    });
    html += '<div style="height:24px"></div></div>';
    $('#scr-cards').innerHTML = html;
    UI.show('scr-cards');
    Music.start('full');
  },
  cardTap(cid) {
    const parts = cid.split('-'), id = parts[0], c = CONCEPTS.find(x => x.id === parts[1]);
    if (!MEMBERS[id] || !c) return;
    if (S.cards.indexOf(cid) >= 0) { this.viewCard(cid); return; }
    const can = S.hearts >= c.price;
    UI.ask({
      html: '<div class="bigcard pc-' + c.id + (c.shiny ? ' shiny' : '') + '" style="width:150px"><div class="pa" style="filter:brightness(0);opacity:.2">' + this.cardArt(id, c) + '</div></div>',
      title: esc(MEMBERS[id].name) + ': ' + esc(T(c.name)),
      text: can ? T('Collect this photocard for {price} hearts? You have {have}.', { price: c.price, have: S.hearts }) : T('This card costs {price} hearts. You have {have}, so you need {more} more. Practice to earn hearts!', { price: c.price, have: S.hearts, more: c.price - S.hearts }),
      buttons: can ? [{ label: T('Not now'), cls: 'white' }, { label: T('Collect it'), cls: 'pink', fn: () => {
        S.hearts -= c.price; S.cards.push(cid); Store.save();
        Sound.play('buy'); FX.rain(50);
        this.cards(); this.viewCard(cid);
      } }] : [{ label: T('OK'), cls: 'pink' }]
    });
  },
  viewCard(cid) {
    const parts = cid.split('-'), id = parts[0], c = CONCEPTS.find(x => x.id === parts[1]), m = MEMBERS[id];
    const back = UI.modal('<div class="bigcard pc-' + c.id + (c.shiny ? ' shiny' : '') + '" id="bigCard"><div class="pa">' + this.cardArt(id, c) + '</div>' +
      '<div class="nm">' + esc(m.name) + '<small>' + esc(T(c.name)) + '</small></div></div>' +
      '<p class="bio"><b>' + esc(T(m.role)) + '.</b> ' + esc(T(m.bio)) + '</p><div class="row"><button class="btn pink" data-close>' + T('Close') + '</button></div>');
    const card = $('#bigCard', back);
    back.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = clamp((e.clientX - r.left) / r.width - 0.5, -0.6, 0.6), y = clamp((e.clientY - r.top) / r.height - 0.5, -0.6, 0.6);
      card.style.setProperty('--ry', (x * 18).toFixed(1) + 'deg'); card.style.setProperty('--rx', (-y * 18).toFixed(1) + 'deg');
    });

  },

  /* ---------- style shop ---------- */
  style(sel) {
    UI.closeAll();
    if (sel) this.styleSel = sel;
    if (!this.styleSel || S.members.indexOf(this.styleSel) < 0) this.styleSel = S.members[0];
    const id = this.styleSel, scrollTop = $('#scr-style .scroll') ? $('#scr-style .scroll').scrollTop : 0;
    $('#scr-style').innerHTML = this.top(T('Style shop')) + '<div class="scroll">' +
      '<div class="stage style-top st-' + S.stage + '"><div class="spot l"></div><div class="spot r"></div><div class="floor"></div>' +
      '<div class="mem"><div class="bob">' + memberArt(id, { expr: 'joy' }) + '</div></div></div>' +
      '<div class="mem-tabs">' + S.members.map(m => '<button class="mem-tab' + (m === id ? ' on' : '') + '" data-act="styleMem" data-id="' + m + '" aria-label="' + MEMBERS[m].name + '">' + faceHTML(m) + '</button>').join('') + '</div>' +
      '<h3 class="shop-h">' + T('Accessories for {who}', { who: esc(MEMBERS[id].name) }) + '</h3><div class="shop-grid">' + ACCS.map(a => {
        const owned = S.accs.indexOf(a.id) >= 0, wearing = (S.wear[id] || 'none') === a.id;
        return '<button class="item' + (wearing ? ' on' : '') + '" data-act="acc" data-id="' + a.id + '"><div class="ic">' + Art.accIcon(a.id) + '</div>' + esc(T(a.name)) +
          '<div class="st">' + (wearing ? T('Wearing') : owned ? T('Tap to wear') : Art.icon('heart') + a.price) + '</div></button>';
      }).join('') + '</div>' +
      '<h3 class="shop-h">' + T('Stage themes') + '</h3><div class="shop-grid">' + STAGES.map(s => {
        const owned = S.stages.indexOf(s.id) >= 0, on = S.stage === s.id;
        return '<button class="item' + (on ? ' on' : '') + '" data-act="stagePick" data-id="' + s.id + '"><div class="swatch st-' + s.id + '"></div>' + esc(T(s.name)) +
          '<div class="st">' + (on ? T('On stage') : owned ? T('Tap to use') : Art.icon('heart') + s.price) + '</div></button>';
      }).join('') + '</div><div style="height:24px"></div></div>';
    UI.show('scr-style');
    const sc = $('#scr-style .scroll');
    if (sc) sc.scrollTop = scrollTop;
    Music.start('full');
  },
  buy(price, what, onBuy) {
    if (S.hearts < price) {
      UI.ask({ title: T('Not enough hearts yet'), text: T('“{what}” costs {price} hearts. You have {have}, so you need {more} more. Practice to earn hearts!', { what: esc(what), price, have: S.hearts, more: price - S.hearts }), buttons: [{ label: T('OK'), cls: 'pink' }] });
      return;
    }
    UI.ask({
      title: T('Buy “{what}”?', { what: esc(what) }), text: T('It costs {price} hearts. You have {have}. After buying you\'ll have {left}.', { price, have: S.hearts, left: S.hearts - price }),
      buttons: [{ label: T('Not now'), cls: 'white' }, { label: T('Buy it'), cls: 'pink', fn: () => { S.hearts -= price; onBuy(); Store.save(); Sound.play('buy'); FX.rain(40); } }]
    });
  },
  accTap(accId) {
    const a = ACCS.find(x => x.id === accId), id = this.styleSel;
    if (!a || !id) return;
    const wear = () => { S.wear[id] = a.id; Store.save(); this.style(); };
    if (S.accs.indexOf(a.id) >= 0) { Sound.play('place'); wear(); return; }
    this.buy(a.price, T(a.name), () => { S.accs.push(a.id); wear(); });
  },
  stageTap(stId) {
    const s = STAGES.find(x => x.id === stId);
    if (!s) return;
    const use = () => { S.stage = s.id; Store.save(); this.style(); };
    if (S.stages.indexOf(s.id) >= 0) { Sound.play('place'); use(); return; }
    this.buy(s.price, T(s.name), () => { S.stages.push(s.id); use(); });
  },

  /* ---------- settings ---------- */
  settings() {
    const back = UI.modal('<h2>' + T('Settings') + '</h2>' +
      '<div class="set-row">' + T('Sound effects') + '<button class="toggle' + (S.sfx ? ' on' : '') + '" data-set="sfx" aria-label="' + T('Sound effects') + '"><i></i></button></div>' +
      '<div class="set-row">' + T('Music') + '<button class="toggle' + (S.music ? ' on' : '') + '" data-set="music" aria-label="' + T('Music') + '"><i></i></button></div>' +
      '<div class="seg" role="group" aria-label="' + T('Language') + '">' + LANGS.map(l => '<button class="' + (S.lang === l.id ? 'on' : '') + '" data-lang="' + l.id + '">' + l.name + '</button>').join('') + '</div>' +
      '<h3>' + T('Puzzle level') + '</h3><div class="seg">' + TIERS.map((t, i) => '<button class="' + (S.tier === i ? 'on' : '') + '" data-tier="' + i + '"><span class="em">' + t.icon + '</span>' + T(t.name) + '</button>').join('') + '</div>' +
      '<p class="tierdesc" id="tierDesc">' + T(TIERS[S.tier].desc) + '</p>' +
      '<h3>' + T('Producer name') + '</h3><div class="dinput"><input class="field" id="setName" maxlength="14" value="' + esc(S.name) + '" autocomplete="off"><button class="btn small mint" id="setNameOk">' + T('Save') + '</button></div>' +
      '<div class="row"><button class="btn white" id="grownups">' + T('For grown-ups') + '</button><button class="btn pink" data-close>' + T('Done') + '</button></div>');
    $$('[data-set]', back).forEach(b => b.addEventListener('click', () => {
      const k = b.getAttribute('data-set');
      S[k] = !S[k]; b.classList.toggle('on', S[k]); Store.save();
      if (k === 'music') { if (S.music) Music.start(UI.current === 'scr-game' ? 'calm' : 'full'); else Music.stop(); }
      Sound.play('tap');
    }));
    $$('[data-tier]', back).forEach(b => b.addEventListener('click', () => {
      S.tier = +b.getAttribute('data-tier'); Store.save();
      $$('[data-tier]', back).forEach(x => x.classList.toggle('on', x === b));
      $('#tierDesc', back).textContent = T(TIERS[S.tier].desc) + ' ' + T('New rounds will use this level.');
      Sound.play('place');
      if (UI.current === 'scr-practice') this.practice();
    }));
    $$('[data-lang]', back).forEach(b => b.addEventListener('click', () => {
      setLang(b.getAttribute('data-lang'));
      Sound.play('place');
      UI.closeModal(back);
      if (UI.current === 'scr-hub') this.hub(); else if (UI.current === 'scr-practice') this.practice();
      this.settings();
    }));
    $('#setNameOk', back).addEventListener('click', () => {
      const v = $('#setName', back).value.trim().replace(/\s+/g, ' ').slice(0, 14);
      if (!v) { UI.retrigger($('#setName', back), 'shake'); return; }
      S.name = v; Store.save(); Sound.play('sparkle'); UI.toast(T('Hello, Producer {name}!', { name: esc(v) }));
      if (UI.current === 'scr-hub') { const h = $('#scr-hub .hello'); if (h) h.textContent = T('Producer {name}', { name: v }); }
    });
    $('#grownups', back).addEventListener('click', () => { UI.closeModal(back); this.parentGate(() => this.parents()); });
  },
  parentGate(then) {
    const a = rand(6, 9), b = rand(12, 19);
    UI.ask({
      title: T('Grown-ups only'), text: T('What is {a} × {b}?', { a, b }),
      html: '<input class="field" id="pgIn" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:22px">',
      buttons: [{ label: T('Cancel'), cls: 'white' }, { label: T('OK'), cls: 'pink', keep: true, fn: back => {
        const inp = $('#pgIn', back);
        if (+inp.value === a * b) { UI.closeModal(back); then(); } else { inp.value = ''; UI.retrigger(inp, 'shake'); }
      } }]
    });
  },
  parents() {
    const s = S.stats;
    const stat = (n, l) => '<div class="stat"><b>' + n + '</b>' + l + '</div>';
    const back = UI.modal('<h2>' + T('For grown-ups') + '</h2>' +
      '<p>' + T('Twinkle Tails wraps short brain workouts in an idol-group story. Everything runs on this device: no ads, no accounts, no purchases, and nothing is sent anywhere.') + '</p>' +
      '<div class="stat-grid">' + stat(s.won, T('rounds won')) + stat(s.stars, T('stars earned')) + stat(s.sums, T('additions made')) + stat(s.orders, T('exact orders')) +
      stat(s.patterns, T('patterns solved')) + stat(s.dances, T('dances memorized')) + stat(s.photos, T('logic grids')) + stat(s.clues, T('clue puzzles')) + '</div>' +
      '<h3>' + T('What each game practices') + '</h3>' +
      '<p class="skill">' + T('<b>🍬 Candy Orders:</b> mental addition and planning ahead with limited moves. Superstar level adds doubling.') + '</p>' +
      '<p class="skill">' + T('<b>💃 Dance Practice:</b> working memory. Sequences grow longer; Superstar sometimes asks for them backwards.') + '</p>' +
      '<p class="skill">' + T('<b>🥁 Pattern Parade:</b> number sequences, skip counting, doubling and repeating patterns, with a short explanation after every answer.') + '</p>' +
      '<p class="skill">' + T('<b>📸 Photo Shoot:</b> sudoku-style deduction with pictures instead of numbers (4×4, then 6×6).') + '</p>' +
      '<p class="skill">' + T('<b>🔍 Stage Clues:</b> reading carefully and logical reasoning: left, right, next to, between, not.') + '</p>' +
      '<p class="skill">' + T('The story also asks her to make choices, name things and budget hearts in the shops. Puzzle level can be changed any time in Settings.') + '</p>' +
      '<h3>' + T('Install it like an app') + '</h3>' +
      '<p class="skill">' + T('<b>iPhone / iPad:</b> open the game\'s web address in Safari, tap Share, then "Add to Home Screen".<br><b>Android:</b> open it in Chrome, tap ⋮, then "Add to Home screen" or "Install app".<br>Progress is saved on the device. No sound on iPhone? Check the silent switch.') + '</p>' +
      '<h3>' + T('Back up progress') + '</h3><p class="skill">' + T('Copy this code and keep it somewhere safe. Paste it below on another device to continue there.') + '</p>' +
      '<textarea class="field" id="bkOut" readonly></textarea><div class="row"><button class="btn small white" id="bkCopy">' + T('Copy code') + '</button></div>' +
      '<textarea class="field" id="bkIn" placeholder="' + T('Paste a backup code here') + '" style="margin-top:12px"></textarea><div class="row"><button class="btn small mint" id="bkLoad">' + T('Restore progress') + '</button></div>' +
      '<h3>' + T('Start over') + '</h3><div class="row"><button class="btn small white" id="resetAll">' + T('Erase all progress') + '</button></div>' +
      '<div class="row"><button class="btn pink" data-close>' + T('Done') + '</button></div>', { cls: 'left' });
    $('#bkOut', back).value = Store.exportCode();
    $('#bkCopy', back).addEventListener('click', () => {
      const ta = $('#bkOut', back);
      const ok = () => UI.toast(T('Backup code copied!'));
      const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { UI.toast(T('Select the code and copy it.')); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
    });
    $('#bkLoad', back).addEventListener('click', () => {
      if (Store.importCode($('#bkIn', back).value)) { UI.closeAll(); UI.toast(T('Progress restored!')); this.hub(); }
      else UI.toast(T('That code didn\'t work. Check that it was copied completely.'));
    });
    $('#resetAll', back).addEventListener('click', () => {
      UI.ask({ title: T('Erase everything?'), text: T('All stars, hearts, photocards and story progress will be deleted. This can\'t be undone.'),
        buttons: [{ label: T('Keep it'), cls: 'white' }, { label: T('Erase'), cls: 'pink', fn: () => { Store.reset(); UI.closeAll(); Music.stop(); this.title(); } }] });
    });
  }
};

/* ===================== MAIN ===================== */
const ACT = {
  start() {
    Sound.unlock();
    if (!S.started) { S.started = true; Store.save(); Music.start('full'); Story.begin(); }
    else Screens.hub();
  },
  hub: () => Screens.hub(),
  lang: el => { setLang(el.getAttribute('data-id')); Screens.title(); },
  practice: () => Screens.practice(),
  cards: () => Screens.cards(),
  style: () => Screens.style(),
  settings: () => Screens.settings(),
  story: () => {
    if (Story.ready()) Story.begin();
    else if (S.chapter < CHAPTERS.length) UI.toast(T('Win practice games to earn more {fandom}!', { fandom: esc(S.fandom) }));
  },
  play: el => Game.launch(el.getAttribute('data-game')),
  quitGame: () => Game.quit(),
  storyClose: () => Story.askExit(),
  styleMem: el => Screens.style(el.getAttribute('data-id')),
  acc: el => Screens.accTap(el.getAttribute('data-id')),
  stagePick: el => Screens.stageTap(el.getAttribute('data-id'))
};

/* home-screen icon, drawn with canvas so the file needs no image assets */
function makeIcon(size) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    if (!x || !x.ellipse) return null;
    const s = size / 100;
    const g = x.createLinearGradient(0, 0, 0, size);
    g.addColorStop(0, '#CDB8FF'); g.addColorStop(1, '#FF9FCF');
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    x.strokeStyle = '#4B2E5C'; x.lineJoin = 'round'; x.lineCap = 'round';
    const ell = (cx, cy, rx, ry, rot, fill, lw) => {
      x.beginPath(); x.ellipse(cx * s, cy * s, rx * s, ry * s, rot, 0, Math.PI * 2);
      x.fillStyle = fill; x.fill();
      if (lw) { x.lineWidth = lw * s; x.stroke(); }
    };
    ell(38, 31, 7.5, 18, -0.22, '#FFFFFF', 3); ell(38, 32, 3.6, 12, -0.22, '#FFC2DC');
    ell(62, 31, 7.5, 18, 0.24, '#FFFFFF', 3); ell(62, 32, 3.6, 12, 0.24, '#FFC2DC');
    ell(50, 61, 30, 26, 0, '#FFFFFF', 3);
    ell(39, 60, 4.6, 6, 0, '#3A2346'); ell(61, 60, 4.6, 6, 0, '#3A2346');
    ell(40.6, 57.6, 1.9, 1.9, 0, '#FFFFFF'); ell(62.6, 57.6, 1.9, 1.9, 0, '#FFFFFF');
    ell(30.5, 68, 5.2, 3, 0, 'rgba(255,143,196,.75)'); ell(69.5, 68, 5.2, 3, 0, 'rgba(255,143,196,.75)');
    ell(50, 65.5, 2.3, 1.6, 0, '#FF86B6');
    x.lineWidth = 2 * s;
    x.beginPath(); x.moveTo(46 * s, 69 * s); x.quadraticCurveTo(48 * s, 72 * s, 50 * s, 69.6 * s); x.quadraticCurveTo(52 * s, 72 * s, 54 * s, 69 * s); x.stroke();
    x.beginPath();
    for (let i = 0; i < 10; i++) { const r = (i % 2 ? 4 : 9) * s, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(79 * s + Math.cos(a) * r, 24 * s + Math.sin(a) * r); }
    x.closePath(); x.fillStyle = '#FFD65C'; x.fill(); x.lineWidth = 2.2 * s; x.stroke();
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}
function setupPWA() {
  try {
    const i180 = makeIcon(180), i192 = makeIcon(192), i512 = makeIcon(512);
    const link = (rel, href, type) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (type) l.type = type; document.head.appendChild(l); };
    if (i180) link('apple-touch-icon', i180);
    if (i192) link('icon', i192, 'image/png');
    if (/^https?:$/.test(location.protocol) && i192 && i512) {
      const start = location.origin + location.pathname + location.search;
      const scope = location.origin + location.pathname.replace(/[^/]*$/, '');
      const man = {
        name: 'Twinkle Tails', short_name: 'Twinkle Tails', start_url: start, scope, display: 'standalone', orientation: 'portrait',
        background_color: '#FFF0F7', theme_color: '#F4BCE0',
        icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }]
      };
      link('manifest', URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })));
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
          if (window.caches) caches.open('twinkle-tails-v1').then(cache => cache.add(start)).catch(() => {});
        }).catch(() => { /* sw.js is optional: without it the game still works online */ });
      }
    }
  } catch (e) { /* installing is optional */ }
}

function init() {
  Store.load();
  document.documentElement.lang = S.lang;
  FX.init();
  setupPWA();
  const unlock = () => Sound.unlock();
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { passive: true, capture: true }));
  document.addEventListener('click', e => {
    const t = e.target;
    if (!t || !t.closest) return;
    const a = t.closest('[data-act]');
    if (a) {
      if (a.disabled) return;
      const fn = ACT[a.getAttribute('data-act')];
      if (fn) { Sound.play('tap'); fn(a, e); }
      return;
    }
    const mem = t.closest('[data-mem]');
    if (mem) { Screens.memberTap(mem.getAttribute('data-mem'), mem); return; }
    const card = t.closest('[data-card]');
    if (card) { Sound.play('tap'); Screens.cardTap(card.getAttribute('data-card')); }
  });
  $('#scr-story').addEventListener('click', e => {
    if (e.target.closest && e.target.closest('button, input, textarea')) return;
    Story.tap();
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (UI.current === 'scr-story' && !$('#modalRoot .modal-back')) { e.preventDefault(); Story.tap(); return; }
    if (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Store.save();
      if (Sound.ctx) { try { Sound.ctx.suspend(); } catch (err) { /* ignore */ } }
    } else if (Sound.ctx) {
      try { const p = Sound.ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ }
    }
  });
  window.addEventListener('pagehide', () => Store.save());
  window.addEventListener('resize', () => { if (UI.current === 'scr-hub') Screens.layoutTroupe(); });
  Screens.title();
  window.__TT = { get S() { return S; }, Game, Story, Screens, Logic, Store, UI, Sound, Music, GAMEMODS, CHAPTERS, T, TR, setLang, i18nAudit };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
