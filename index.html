  --ink: #4B2E5C; --ink2: #76598A;
  --lilac: #B89CFF; --lilac-l: #ECE4FF;
  --pink: #FF8FC4; --pink-d: #F0609F; --pink-l: #FFE3F0;
  --mint: #6FE3C1; --mint-l: #D8F8EE;
  --butter: #FFD65C; --butter-l: #FFF4C9;
  --sky: #8CCBFF; --sky-l: #DDF0FF;
  --cloud: #FFF0F7;
  --line: 3px solid var(--ink);
  --pop: 0 4px 0 var(--ink);
  --pop-sm: 0 3px 0 var(--ink);
  --font: 'Nunito', ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%;
}
body {
  background-color: var(--cloud);
  background-image: radial-gradient(rgba(184,156,255,.28) 2px, transparent 2.6px), radial-gradient(rgba(255,143,196,.26) 2px, transparent 2.6px);
  background-size: 30px 30px; background-position: 0 0, 15px 15px;
}
button { font-family: inherit; color: inherit; }
input, textarea { font-family: inherit; -webkit-user-select: text; user-select: text; font-size: 18px; color: var(--ink); }
svg { display: block; }
.ico { width: 24px; height: 24px; flex: none; }

#root { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
#frame { position: relative; height: 100%; max-width: 520px; margin: 0 auto; }
.screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
.screen.active { display: flex; animation: scrIn .22s ease-out; }
@keyframes scrIn { from { opacity: 0; } to { opacity: 1; } }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }

/* ---------- buttons, pills ---------- */
.btn {
  font-weight: 600; font-size: 18px; background: var(--butter); border: var(--line); border-radius: 999px;
  padding: 10px 22px; box-shadow: var(--pop); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 50px; line-height: 1.15; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); } .btn.lilac { background: var(--lilac); } .btn.mint { background: var(--mint); }
.btn.white { background: #fff; } .btn.sky { background: var(--sky); }
.btn.big { font-size: 22px; padding: 12px 30px; min-height: 60px; }
.btn.small { font-size: 16px; min-height: 42px; padding: 6px 14px; }
.btn:disabled, .btn.off { opacity: .45; }
.btn:focus-visible, .ibtn:focus-visible, .pad:focus-visible, .popt:focus-visible, .gcard:focus-visible { outline: 3px dashed var(--pink-d); outline-offset: 3px; }
.ibtn { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: var(--line); box-shadow: var(--pop-sm); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: var(--line); border-radius: 999px; padding: 3px 12px 3px 5px; font-weight: 700; font-size: 17px; box-shadow: var(--pop-sm); white-space: nowrap; }
.pill.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.topbar .grow { flex: 1; min-width: 0; }
.topbar h2 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hello { font-weight: 600; font-size: 15px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- logo ---------- */
.logo {
  font-weight: 700; line-height: .95; letter-spacing: .5px; margin: 0;
  text-shadow: 2.5px 0 var(--ink), -2.5px 0 var(--ink), 0 2.5px var(--ink), 0 -2.5px var(--ink), 1.8px 1.8px var(--ink), -1.8px -1.8px var(--ink), 1.8px -1.8px var(--ink), -1.8px 1.8px var(--ink), 0 6px 0 var(--ink);
}
.logo span:nth-child(5n+1) { color: #FF9FCF; } .logo span:nth-child(5n+2) { color: #C4AAFF; } .logo span:nth-child(5n+3) { color: #7FE8C9; }
.logo span:nth-child(5n+4) { color: #FFDD70; } .logo span:nth-child(5n) { color: #9DD4FF; }

/* ---------- characters ---------- */
.char { width: 100%; height: auto; overflow: visible; }
.char .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.jump { animation: jump .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes jump { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-22px) scale(1.04, .96); } 60% { transform: translateY(0) scale(1.06, .92); } 100% { transform: none; } }

/* ---------- title ---------- */
#scr-title { align-items: center; justify-content: center; text-align: center; padding: 20px; }
.t-logo .logo { font-size: clamp(50px, 16vw, 76px); }
.t-sub { font-weight: 600; font-size: 18px; color: var(--ink2); margin: 14px 0 0; }
.t-crew { position: relative; width: 100%; max-width: 440px; height: min(40vh, 330px); margin: 18px auto 20px; }
.t-crew .m { position: absolute; bottom: 0; width: 30%; }
.t-note { font-size: 13px; color: var(--ink2); margin-top: 16px; }
.t-lang { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.t-lang button { min-height: 44px; padding: 6px 14px; border: var(--line); border-radius: 99px; background: #fff; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: var(--pop-sm); }
.t-lang button.on { background: var(--butter); }

/* ---------- hub ---------- */
.hub-logo { text-align: center; padding: 2px 0 0; }
.hub-logo .logo { font-size: clamp(28px, 9vw, 40px); }
.stage { position: relative; flex: 1; min-height: 210px; margin: 8px 12px 0; border: var(--line); border-radius: 28px 28px 20px 20px; box-shadow: var(--pop); overflow: hidden; }
.stage .spot { position: absolute; top: -8%; width: 55%; height: 118%; background: linear-gradient(to bottom, rgba(255,255,255,.62), rgba(255,255,255,0) 82%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); transform-origin: 50% 0; pointer-events: none; }
.stage .spot.l { left: -6%; animation: sweepL 7s ease-in-out infinite alternate; }
.stage .spot.r { right: -6%; animation: sweepR 7s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(-16deg); } to { transform: rotate(8deg); } }
@keyframes sweepR { from { transform: rotate(16deg); } to { transform: rotate(-8deg); } }
.stage .floor { position: absolute; left: -10%; right: -10%; bottom: -44px; height: 110px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.95), rgba(255,255,255,.5) 55%, rgba(255,255,255,0) 72%); }
.deco { position: absolute; font-size: 18px; color: #fff; opacity: 0; animation: drift 11s linear infinite; pointer-events: none; text-shadow: 0 0 6px rgba(255,255,255,.8); }
@keyframes drift { 0% { transform: translateY(20px) rotate(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateY(-160px) rotate(40deg); opacity: 0; } }
.st-dream { background: linear-gradient(180deg, #CDB8FF 0%, #F4BCE0 60%, #FFE3F1 100%); }
.st-candy { background: radial-gradient(circle at 50% 118%, #FFF6A8 0 28%, rgba(255,246,168,0) 58%), repeating-linear-gradient(-45deg, #FFB8D9 0 22px, #FFD6EA 22px 44px); }
.st-night { background: radial-gradient(circle at 82% 16%, #FFF3BF 0 15px, rgba(255,243,191,0) 16px), radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.7px) 0 0 / 36px 36px, linear-gradient(180deg, #2A2465 0%, #5A3F9E 62%, #9A6ED0 100%); }
.st-blossom { background: radial-gradient(circle at 18% 22%, #fff 0 5px, transparent 6px) 0 0 / 60px 60px, linear-gradient(180deg, #FFC4DE 0%, #FFE3EF 70%, #FFF3F8 100%); }
.st-ocean { background: radial-gradient(circle, rgba(255,255,255,.55) 0 4px, transparent 5px) 0 0 / 48px 58px, linear-gradient(180deg, #A5E6FF 0%, #74C8F2 60%, #56AEE3 100%); }
.troupe { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; flex-direction: column; align-items: center; }
.troupe .row { display: flex; justify-content: center; align-items: flex-end; }
.troupe .row.back { margin-bottom: -30px; }
.mem { position: relative; cursor: pointer; flex: none; }
.stage-say { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 88%; display: flex; align-items: center; gap: 6px; background: #fff; border: var(--line); border-radius: 18px; padding: 5px 12px 5px 5px; font-weight: 600; font-size: 15px; box-shadow: var(--pop-sm); z-index: 3; animation: sayIn .25s cubic-bezier(.2,1.5,.45,1); }
.stage-say .face { width: 34px; height: 34px; }
@keyframes sayIn { from { transform: translateX(-50%) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
.story-card { margin: 12px 12px 0; background: #fff; border: var(--line); border-radius: 22px; box-shadow: var(--pop); padding: 10px 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.story-card .book { font-size: 32px; flex: none; }
.story-card .txt { flex: 1; min-width: 0; }
.story-card .ch { font-size: 13px; color: var(--ink2); font-weight: 600; }
.story-card h3 { margin: 1px 0 5px; font-size: 18px; line-height: 1.15; }
.story-card .need { font-size: 13px; font-weight: 600; color: var(--ink2); margin-top: 4px; }
.story-card.ready { background: var(--butter-l); animation: readyGlow 1.6s ease-in-out infinite; }
@keyframes readyGlow { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 6px rgba(255,143,196,.45); } }
.bar { height: 14px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--lilac-l); overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 6px; background: repeating-linear-gradient(-45deg, var(--pink) 0 8px, #FFB3D6 8px 16px); border-right: 2.5px solid var(--ink); border-radius: 0 99px 99px 0; }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 12px 12px; }
.nav .btn { flex-direction: column; border-radius: 22px; padding: 6px 4px; font-size: 15px; gap: 1px; min-height: 68px; }
.nav .btn .em { font-size: 27px; line-height: 1.1; }
.badge { position: absolute; top: -8px; right: -6px; background: var(--pink); color: #fff; border: 2.5px solid var(--ink); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 1px 7px; text-shadow: 0 1px 0 var(--ink); }
.rel { position: relative; }

/* ---------- practice menu ---------- */
.glist { padding: 6px 12px 20px; display: flex; flex-direction: column; gap: 12px; }
.gcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: var(--line); border-radius: 22px; box-shadow: var(--pop); padding: 10px 12px; cursor: pointer; position: relative; }
.gcard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.gcard .gi { width: 60px; height: 60px; border-radius: 18px; border: var(--line); display: grid; place-items: center; font-size: 32px; flex: none; }
.gcard .gt { flex: 1; min-width: 0; }
.gcard b { display: block; font-size: 19px; }
.gcard .gd { display: block; font-size: 14px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
.gcard .gs { display: inline-block; font-size: 12px; font-weight: 600; background: var(--lilac-l); border-radius: 99px; padding: 2px 8px; margin-top: 5px; }
.gcard .glv { font-weight: 700; font-size: 14px; text-align: center; flex: none; }
.gcard .glv big { display: block; font-size: 24px; line-height: 1; }
.gcard.locked { background: #F4EEF8; box-shadow: none; }
.gcard.locked .gi { filter: grayscale(1); opacity: .5; }
.tierline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 12px 4px; font-size: 14px; font-weight: 600; color: var(--ink2); }

/* ---------- game shell ---------- */
.game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ghead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.ghead h2 { margin: 0; font-size: 20px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl { font-size: 13px; font-weight: 700; background: var(--lilac); border: 2.5px solid var(--ink); border-radius: 99px; padding: 2px 9px; vertical-align: 3px; margin-left: 4px; }
.coach { display: flex; align-items: center; gap: 8px; margin: 4px 12px; background: #fff; border: var(--line); border-radius: 18px; padding: 6px 10px 6px 6px; box-shadow: var(--pop-sm); font-weight: 600; font-size: 15px; line-height: 1.3; animation: sayInB .3s cubic-bezier(.2,1.5,.45,1); }
.coach .face { width: 40px; height: 40px; flex: none; }
.coach .grow { flex: 1; }
@keyframes sayInB { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.face { border-radius: 50%; background: var(--c, var(--lilac-l)); border: 2.5px solid var(--ink); overflow: hidden; display: grid; place-items: center; }
.face .char { width: 118%; margin-top: 12%; }
.hearts { display: inline-flex; gap: 2px; } .hearts .ico { width: 22px; height: 22px; } .hearts .gone { opacity: .22; filter: grayscale(1); }

/* ---------- merge (candy orders) ---------- */
.orders { display: flex; gap: 8px; justify-content: center; padding: 6px 10px 2px; }
.order { flex: 1; max-width: 118px; background: #fff; border: var(--line); border-radius: 18px; box-shadow: var(--pop-sm); padding: 6px 4px 8px; text-align: center; position: relative; cursor: pointer; }
.order .fan { font-size: 30px; line-height: 1.05; }
.order .want { margin: 3px auto 0; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: var(--line); font-weight: 700; font-size: 22px; background: var(--c); }
.order.ready { background: var(--butter-l); animation: readyGlow 1s ease-in-out infinite; }
.order.new { animation: popIn .4s cubic-bezier(.2,1.5,.45,1); }
.order.thanks::after { content: 'Thank you!'; position: absolute; left: 50%; top: -12px; transform: translateX(-50%); background: var(--pink); border: 2.5px solid var(--ink); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 1px 8px; white-space: nowrap; }
.mhud { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; font-weight: 600; font-size: 16px; gap: 8px; }
.mhud .prog { display: inline-flex; gap: 2px; flex-wrap: wrap; } .mhud .prog .ico { width: 20px; height: 20px; }
.movesbox { display: inline-flex; align-items: center; gap: 6px; }
.movesbox b { font-size: 22px; min-width: 30px; text-align: center; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 0 6px; }
.movesbox b.low { background: #FFD0D0; }
.board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
.board { display: grid; gap: 6px; padding: 8px; background: rgba(255,255,255,.75); border: var(--line); border-radius: 24px; box-shadow: var(--pop); touch-action: none; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); }
.mcell { position: relative; border-radius: 16px; background: var(--lilac-l); border: 2px dashed rgba(75,46,92,.16); }
.candy { position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px; border-radius: 50%; border: var(--line); box-shadow: inset 0 -6px 0 rgba(75,46,92,.1), 0 3px 0 var(--ink); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--cell) * .4); color: var(--ink); touch-action: none; z-index: 1; cursor: grab;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,0) 10%), var(--c); }
.candy.sel { transform: scale(1.1); box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--pink), 0 3px 0 var(--ink); z-index: 2; }
.candy.match { animation: matchPulse 1.1s ease-in-out infinite; }
@keyframes matchPulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--butter), 0 3px 0 var(--ink); } }
.candy.dragging { z-index: 60; pointer-events: none; animation: none; box-shadow: 0 14px 22px rgba(75,46,92,.35), 0 3px 0 var(--ink); }
.candy.pop { animation: candyPop .38s cubic-bezier(.2,1.6,.45,1); }
@keyframes candyPop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
.candy.x2 { background: conic-gradient(#FF9FCF, #FFD86B, #8EE3B7, #8CCBFF, #C4AAFF, #FF9FCF); font-size: calc(var(--cell) * .3); text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
.drop-ok { outline: 4px solid var(--mint); outline-offset: 2px; border-radius: 18px; }
.mctrl { display: flex; gap: 10px; justify-content: center; align-items: center; padding: 8px 12px 12px; }
.mctrl .btn { min-height: 56px; }
.gift { font-size: 17px; }
.gift .em { font-size: 26px; }
.shake { animation: shake .42s; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.hint-pulse { animation: hintPulse .9s ease-in-out 3 !important; }
@keyframes hintPulse { 50% { box-shadow: 0 0 0 6px #fff, 0 0 0 11px var(--mint), 0 3px 0 var(--ink); transform: scale(1.08); } }
.hand { position: fixed; z-index: 75; font-size: 40px; pointer-events: none; margin: -6px 0 0 -12px; animation: handMove 1.5s ease-in-out 2 forwards; filter: drop-shadow(0 3px 0 rgba(75,46,92,.35)); }
@keyframes handMove { 0% { transform: translate(0, 0); opacity: 0; } 15% { transform: translate(0, 0); opacity: 1; } 70% { transform: translate(var(--dx), var(--dy)); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* ---------- dance ---------- */
.dstage { flex: 1; position: relative; min-height: 170px; margin: 6px 12px 0; border: var(--line); border-radius: 26px; box-shadow: var(--pop); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.dancer { width: min(44%, 180px); margin-bottom: 6px; position: relative; z-index: 2; }
.dancer.mv0 { animation: dHop .45s cubic-bezier(.3,1.5,.5,1); }
.dancer.mv1 { animation: dSpin .5s ease-in-out; }
.dancer.mv2 { animation: dLeanL .45s ease-in-out; }
.dancer.mv3 { animation: dLeanR .45s ease-in-out; }
@keyframes dHop { 40% { transform: translateY(-30px) scale(1.05, .95); } }
@keyframes dSpin { 100% { transform: rotateY(360deg); } }
@keyframes dLeanL { 50% { transform: rotate(-14deg) translateX(-16px); } }
@keyframes dLeanR { 50% { transform: rotate(14deg) translateX(16px); } }
.dsay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fff; border: var(--line); border-radius: 18px; padding: 6px 14px; font-weight: 700; font-size: 18px; box-shadow: var(--pop-sm); white-space: nowrap; z-index: 3; }
.movepop { position: absolute; left: 50%; top: 32%; font-size: 48px; z-index: 4; pointer-events: none; animation: movePop .65s ease-out forwards; }
@keyframes movePop { 0% { transform: translate(-50%, 10px) scale(.4); opacity: 0; } 30% { transform: translate(-50%, -10px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -46px) scale(1); opacity: 0; } }
.dstatus { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 2px; gap: 10px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots i { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; display: block; }
.dots i.on { background: var(--pink); } .dots i.hit { background: var(--butter); }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 14px 14px; }
.pad { height: clamp(76px, 14vh, 116px); border: var(--line); border-radius: 26px; box-shadow: var(--pop); background: var(--c); font-size: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; cursor: pointer; transition: transform .08s, box-shadow .08s, filter .08s; touch-action: manipulation; }
.pad small { font-size: 15px; font-weight: 700; margin-top: 4px; }
.pad.lit { filter: brightness(1.12) saturate(1.25); transform: translateY(2px) scale(1.04); box-shadow: 0 0 0 5px #fff, 0 0 26px 10px var(--c), 0 2px 0 var(--ink); }
.pads.locked .pad { cursor: default; }
.pads.locked .pad:not(.lit) { opacity: .72; }
.mirror-tag { display: inline-block; background: var(--sky); border: 2.5px solid var(--ink); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: 14px; }

/* ---------- pattern ---------- */
.pq { font-weight: 700; font-size: 15px; }
.parade { --tk: 48px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 16px 10px; background: #fff; border: var(--line); border-radius: 24px; margin: 8px 12px; box-shadow: var(--pop); min-height: 90px; }
.ptok { width: var(--tk); height: var(--tk); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--tk) * .4); flex: none; }
.ptok.num { border-radius: 50%; border: var(--line); background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,0) 10%), var(--c); }
.ptok.emo { font-size: calc(var(--tk) * .72); }
.ptok.pic .face { width: 100%; height: 100%; }
.ptok.q { border: 3px dashed var(--ink); border-radius: 50%; background: var(--butter-l); font-size: calc(var(--tk) * .5); animation: qBob 1.1s ease-in-out infinite; }
@keyframes qBob { 50% { transform: translateY(-4px); } }
.ptok.filled { animation: popIn .4s cubic-bezier(.2,1.5,.45,1); }
.popts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 14px; }
.popt { min-height: 74px; border: var(--line); border-radius: 22px; box-shadow: var(--pop); background: #fff; font-size: 30px; font-weight: 700; display: grid; place-items: center; cursor: pointer; }
.popt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.popt .face { width: 54px; height: 54px; }
.popt.good { background: var(--mint); } .popt.bad { background: #FFC4C4; animation: shake .42s; } .popt.dim { opacity: .45; }
.prule { margin: 6px 14px; padding: 10px 14px; background: var(--butter-l); border: var(--line); border-radius: 18px; font-weight: 600; font-size: 17px; text-align: center; box-shadow: var(--pop-sm); animation: sayInB .3s cubic-bezier(.2,1.5,.45,1); }
.prule .btn { margin-top: 8px; }

/* ---------- photo sudoku ---------- */
.swrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
.sgrid { display: grid; grid-template-columns: repeat(var(--n), var(--sc)); grid-auto-rows: var(--sc); border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: #fff; box-shadow: var(--pop); }
.scell { border-right: 1.5px solid rgba(75,46,92,.25); border-bottom: 1.5px solid rgba(75,46,92,.25); display: grid; place-items: center; cursor: pointer; position: relative; }
.scell.bR { border-right: 3.5px solid var(--ink); } .scell.bB { border-bottom: 3.5px solid var(--ink); }
.scell.eR { border-right: 0; } .scell.eB { border-bottom: 0; }
.scell.given { background: #F4EEFF; }
.scell.hl { background: #FFF8E1; }
.scell.sel { background: var(--butter-l); box-shadow: inset 0 0 0 4px var(--pink-d); }
.scell.bad { background: #FFD6D6; }
.scell .face { width: 82%; height: 82%; }
.scell.given .face { border-width: 3px; }
.scell .face.put { animation: popIn .32s cubic-bezier(.2,1.5,.45,1); }
.scell .emo { font-size: calc(var(--sc) * .58); }
.palette { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 8px 10px 14px; }
.palette button { width: 54px; height: 54px; border-radius: 50%; border: var(--line); box-shadow: var(--pop-sm); background: #fff; padding: 3px; cursor: pointer; display: grid; place-items: center; font-size: 28px; }
.palette button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.palette button .face { width: 100%; height: 100%; border: 0; }
.flash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 72; pointer-events: none; animation: flash .5s ease-out forwards; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }

/* ---------- line-up clues ---------- */
.lstage { margin: 6px 12px 0; border: var(--line); border-radius: 24px; background: linear-gradient(180deg, #E4D8FF, #FFE3F1); padding: 12px 8px 22px; box-shadow: var(--pop); }
.slots { display: flex; justify-content: center; gap: 7px; }
.slot { width: var(--sw); height: calc(var(--sw) * 1.22); border: 3px dashed rgba(75,46,92,.45); border-radius: 18px; background: rgba(255,255,255,.55); position: relative; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; }
.slot .no { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); width: 26px; height: 26px; border-radius: 50%; background: var(--butter); border: 2.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.slot.filled { border-style: solid; border-color: var(--ink); background: #fff; }
.slot.target { box-shadow: 0 0 0 4px var(--butter); }
.slot .char { width: 96%; }
.slot.sel { background: var(--pink-l); }
.lr { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--ink2); padding: 0 16px; margin-top: 6px; }
.pool { display: flex; gap: 8px; justify-content: center; align-items: flex-end; padding: 4px 8px; min-height: 84px; flex-wrap: wrap; }
.tok { width: 62px; text-align: center; cursor: pointer; font-weight: 700; font-size: 13px; border-radius: 16px; padding: 2px; transition: transform .12s; }
.tok .face { width: 54px; height: 54px; margin: 0 auto 2px; }
.tok.sel { transform: translateY(-6px); background: var(--pink-l); box-shadow: 0 0 0 3px var(--pink); }
.pool .empty { font-size: 14px; color: var(--ink2); font-weight: 600; align-self: center; }
.clues { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 4px; }
.clue { background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 16.5px; line-height: 1.45; font-weight: 500; }
.clue .no { width: 26px; height: 26px; border-radius: 50%; background: var(--lilac); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.clue .mark { margin-left: auto; font-size: 20px; flex: none; min-width: 22px; text-align: center; }
.clue.ok { background: var(--mint-l); } .clue.bad { background: #FFE0E0; animation: shake .42s; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; white-space: nowrap; vertical-align: middle; }
.chip .face { width: 26px; height: 26px; border-width: 2px; }
.lfoot { padding: 6px 12px 12px; display: flex; gap: 10px; justify-content: center; }

/* ---------- story ---------- */
#scr-story { overflow: hidden; cursor: pointer; }
.sbg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; transition: opacity .4s; }
.sbg > i { position: absolute; display: block; }
.bg-academy { background: linear-gradient(180deg, #E6DBFF 0 64%, #F1C9A5 64% 100%); }
.bg-academy .mirror { left: 8%; right: 8%; top: 7%; height: 42%; border: 5px solid #fff; border-radius: 22px; background: linear-gradient(120deg, rgba(255,255,255,.75), rgba(255,255,255,.25) 40%, rgba(255,255,255,.6) 44%, rgba(255,255,255,.2) 48%, rgba(255,255,255,.45)); box-shadow: 0 0 0 3px rgba(75,46,92,.15); }
.bg-academy .barre { left: 0; right: 0; top: 54%; height: 8px; background: #fff; border-top: 2px solid rgba(75,46,92,.2); border-bottom: 2px solid rgba(75,46,92,.2); }
.bg-academy .planks { left: 0; right: 0; top: 64%; bottom: 0; background: repeating-linear-gradient(90deg, rgba(120,70,40,.1) 0 3px, rgba(0,0,0,0) 3px 70px); }
.bg-park { background: linear-gradient(180deg, #9FDCFF 0%, #D7F1FF 55%, #B9EFA8 55.5%, #8CD98A 100%); }
.bg-park .sun { right: 10%; top: 6%; width: 70px; height: 70px; border-radius: 50%; background: #FFE27A; box-shadow: 0 0 0 12px rgba(255,226,122,.35); }
.bg-park .hill { left: -20%; right: 30%; top: 48%; height: 30%; border-radius: 50%; background: #A6E69A; }
.bg-park .hill2 { left: 35%; right: -25%; top: 46%; height: 30%; border-radius: 50%; background: #97DE8C; }
.bg-park .tree { width: 90px; height: 90px; border-radius: 50%; background: #6FCB7A; box-shadow: 30px 20px 0 #63BF6F, -26px 22px 0 #7AD686; top: 30%; }
.bg-park .tree.a { left: 6%; } .bg-park .tree.b { right: 8%; top: 26%; transform: scale(.8); }
.bg-stage { background: linear-gradient(180deg, #2B2166 0%, #5B3AA0 58%, #3A2A78 100%); }
.bg-stage .beam { top: -10%; width: 40%; height: 90%; background: linear-gradient(to bottom, rgba(255,240,255,.55), rgba(255,240,255,0)); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
.bg-stage .beam.a { left: 4%; transform: rotate(-14deg); } .bg-stage .beam.b { right: 4%; transform: rotate(14deg); } .bg-stage .beam.c { left: 30%; }
.bg-stage .crowd { left: 0; right: 0; bottom: 0; height: 26%; background: radial-gradient(circle, #FF8FC4 0 5px, transparent 6px) 0 0 / 34px 30px, radial-gradient(circle, #B89CFF 0 5px, transparent 6px) 17px 15px / 34px 30px, linear-gradient(180deg, #1E1650, #140F38); animation: crowd 1.2s ease-in-out infinite alternate; }
@keyframes crowd { to { background-position: 0 -4px, 17px 11px, 0 0; } }
.bg-studio { background: radial-gradient(ellipse at 50% 38%, #fff 0, #FFE6F2 55%, #F7C8DE 100%); }
.bg-studio .soft { top: 5%; width: 90px; height: 70px; border-radius: 16px; background: #fff; border: 4px solid rgba(75,46,92,.25); box-shadow: 0 0 40px 18px rgba(255,255,255,.9); }
.bg-studio .soft.a { left: 6%; } .bg-studio .soft.b { right: 6%; }
.bg-night { background: radial-gradient(circle at 78% 14%, #FFF3BF 0 26px, rgba(255,243,191,0) 27px), radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.8px) 0 0 / 40px 40px, linear-gradient(180deg, #1F1B55 0%, #463493 60%, #7C5BC4 100%); }
.bg-night .city { left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(90deg, #2A2260 0 12%, transparent 12% 14%, #332A70 14% 30%, transparent 30% 32%, #2A2260 32% 46%, transparent 46% 48%, #3A3080 48% 66%, transparent 66% 68%, #2A2260 68% 84%, transparent 84% 86%, #332A70 86% 100%); clip-path: polygon(0 30%, 12% 30%, 12% 10%, 30% 10%, 30% 40%, 46% 40%, 46% 0, 66% 0, 66% 25%, 84% 25%, 84% 15%, 100% 15%, 100% 100%, 0 100%); }
.scast { position: absolute; left: 0; right: 0; bottom: calc(30% + 30px); display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
.actor { width: min(33%, 170px); transition: transform .3s, filter .3s; margin: 0 -2%; }
.actor.talk { transform: translateY(-8px) scale(1.07); z-index: 2; }
.actor.quiet { filter: saturate(.75) brightness(.93); }
.actor.enter { animation: popIn .45s cubic-bezier(.2,1.5,.45,1); }
.dbox { position: absolute; left: 10px; right: 10px; bottom: 12px; min-height: 30%; background: #fff; border: var(--line); border-radius: 24px; box-shadow: var(--pop); padding: 24px 16px 16px; display: flex; flex-direction: column; }
.dname { position: absolute; top: -19px; left: 16px; padding: 3px 14px; border: var(--line); border-radius: 999px; background: var(--c, var(--lilac)); font-weight: 700; font-size: 18px; box-shadow: var(--pop-sm); }
.dtext { font-size: clamp(18px, 4.8vw, 21px); line-height: 1.42; font-weight: 500; min-height: 3em; }
.dnext { position: absolute; right: 16px; bottom: 8px; font-size: 20px; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(4px); } }
.dchoices { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.dchoices .btn { width: 100%; justify-content: flex-start; text-align: left; font-size: 17px; border-radius: 18px; padding: 8px 14px; }
.dinput { display: flex; gap: 8px; margin-top: 12px; }
.dinput input { flex: 1; min-width: 0; border: var(--line); border-radius: 16px; padding: 10px 14px; background: var(--butter-l); outline: none; }
.sclose { position: absolute; top: 10px; right: 10px; z-index: 5; }

/* ---------- photocards ---------- */
.cards-sub { margin: 0 12px 6px; font-weight: 600; font-size: 15px; color: var(--ink2); }
.cgroup { margin: 6px 12px 0; }
.cgroup h3 { margin: 10px 2px 8px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.cgroup h3 .face { width: 32px; height: 32px; }
.cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.pcard { position: relative; border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: var(--pop-sm); background: var(--pc); cursor: pointer; }
.pcard::before { content: ''; display: block; padding-top: 140%; }
.pcard .pa { position: absolute; left: 4%; right: 4%; bottom: 3%; }
.pcard .pa .char { width: 100%; }
.pcard.not .pa { filter: brightness(0); opacity: .18; }
.pcard .tag { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); background: #fff; border: 2px solid var(--ink); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 0 5px 0 2px; display: flex; align-items: center; gap: 1px; white-space: nowrap; }
.pcard .tag .ico { width: 14px; height: 14px; }
.pcard.shiny::after, .bigcard.shiny::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(115deg, rgba(255,255,255,0) 25%, rgba(255,255,255,.7) 40%, rgba(255,215,255,.4) 46%, rgba(255,255,255,0) 60%); background-size: 260% 100%; animation: holo 3.4s linear infinite; pointer-events: none; }
.pcard.not.shiny::after { display: none; }
@keyframes holo { from { background-position: 160% 0; } to { background-position: -110% 0; } }
.pc-debut { --pc: linear-gradient(160deg, #E4D8FF, #FFE0EF); }
.pc-candy { --pc: repeating-linear-gradient(45deg, #FFD6EA 0 9px, #FFFFFF 9px 18px); }
.pc-spring { --pc: radial-gradient(circle at 30% 30%, #fff 0 4px, transparent 5px) 0 0 / 26px 26px, linear-gradient(180deg, #FFC9E0, #FFF1F7); }
.pc-night { --pc: radial-gradient(rgba(255,255,255,.95) 1px, transparent 1.6px) 0 0 / 16px 16px, linear-gradient(180deg, #2D2A6E, #6E4FB8); }
.pc-dream { --pc: linear-gradient(135deg, #FFC8E6, #D6C8FF, #C3EEFF, #D5FFE3, #FFF1B8); }
.bigcard { position: relative; width: min(70vw, 280px); margin: 4px auto 10px; border: var(--line); border-radius: 22px; overflow: hidden; background: var(--pc); box-shadow: var(--pop); transform: perspective(700px) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transition: transform .12s; }
.bigcard::before { content: ''; display: block; padding-top: 140%; }
.bigcard .pa { position: absolute; left: 8%; right: 8%; bottom: 13%; }
.bigcard .pa .char { width: 100%; }
.bigcard .nm { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: var(--line); padding: 6px 4px; font-weight: 700; font-size: 18px; }
.bigcard .nm small { display: block; font-size: 13px; color: var(--ink2); font-weight: 600; }
.bio { font-size: 15px; color: var(--ink2); line-height: 1.4; margin: 0 4px 6px; }

/* ---------- style shop ---------- */
.style-top { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 4px 12px 0; height: 180px; border: var(--line); border-radius: 24px; box-shadow: var(--pop); position: relative; overflow: hidden; flex: none; }
.style-top .mem { width: 120px; margin-bottom: 4px; z-index: 1; }
.mem-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 6px; flex: none; }
.mem-tab { flex: none; width: 58px; height: 58px; border-radius: 50%; border: var(--line); background: #fff; padding: 0; cursor: pointer; box-shadow: var(--pop-sm); overflow: hidden; }
.mem-tab .face { width: 100%; height: 100%; border: 0; }
.mem-tab.on { box-shadow: 0 0 0 4px var(--pink), var(--pop-sm); }
.shop-h { margin: 12px 14px 6px; font-size: 18px; }
.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px 6px; }
.item { background: #fff; border: var(--line); border-radius: 18px; box-shadow: var(--pop-sm); padding: 8px 4px 7px; text-align: center; font-weight: 600; font-size: 14px; cursor: pointer; line-height: 1.2; }
.item:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.item .ic { width: 42px; height: 42px; margin: 0 auto 4px; }
.item .st { font-size: 12.5px; color: var(--ink2); margin-top: 3px; display: flex; align-items: center; justify-content: center; gap: 2px; }
.item .st .ico { width: 15px; height: 15px; }
.item.on { background: var(--mint-l); }
.item .swatch { width: 100%; height: 42px; border-radius: 12px; border: 2.5px solid var(--ink); margin-bottom: 4px; }

/* ---------- modal, toast, floaters ---------- */
#modalRoot .modal-back { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(75,46,92,.4); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; animation: fadeIn .18s; }
.modal { background: #fff; border: var(--line); border-radius: 28px; box-shadow: 0 6px 0 var(--ink); width: min(100%, 420px); max-height: 90%; overflow-y: auto; padding: 20px 18px 18px; text-align: center; animation: popIn .32s cubic-bezier(.2,1.5,.45,1); }
.modal h2 { margin: 2px 0 6px; font-size: 26px; line-height: 1.15; }
.modal h3 { margin: 14px 0 6px; font-size: 19px; }
.modal p { margin: 6px 0 10px; font-size: 17px; line-height: 1.42; color: var(--ink2); }
.modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.modal .mchar { width: 110px; margin: -4px auto 0; }
.modal.left { text-align: left; }
.modal.left p { font-size: 15.5px; }
@media (max-height: 700px) { .modal { max-height: 96%; padding-top: 14px; padding-bottom: 14px; } .modal h3 { margin: 8px 0 4px; } }
.modal-back.closing { animation: fadeOut .18s forwards; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.res-stars { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
.res-stars .rs { width: 58px; height: 58px; opacity: 0; animation: starIn .45s cubic-bezier(.2,1.6,.45,1) forwards; }
.res-stars .rs:nth-child(2) { width: 70px; height: 70px; margin-top: -10px; }
.res-stars .rs .ico { width: 100%; height: 100%; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.res-rew { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
#toastRoot { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 80; pointer-events: none; }
.toast { background: #fff; border: var(--line); border-radius: 20px; padding: 8px 16px; font-weight: 600; font-size: 16px; box-shadow: var(--pop-sm); max-width: 92%; text-align: center; animation: sayInB .25s cubic-bezier(.2,1.5,.45,1); transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateY(-10px); }
.floater { position: fixed; transform: translate(-50%, -50%); font-weight: 700; font-size: 20px; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 11px; pointer-events: none; z-index: 74; animation: floatUp 1.25s ease-out forwards; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
@keyframes floatUp { 0% { transform: translate(-50%, -30%) scale(.7); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.06); } 75% { opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
#fx { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 73; }

/* ---------- settings ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 2px dashed var(--lilac-l); font-size: 17px; font-weight: 600; text-align: left; }
.toggle { width: 64px; height: 36px; border-radius: 99px; border: var(--line); background: #EDE6F2; position: relative; cursor: pointer; flex: none; padding: 0; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); transition: left .15s; }
.toggle.on { background: var(--mint); } .toggle.on i { left: 30px; }
.seg { display: flex; gap: 6px; margin: 8px 0 4px; }
.seg button { flex: 1; border: var(--line); border-radius: 16px; background: #fff; padding: 8px 2px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--pop-sm); line-height: 1.2; }
.seg button .em { display: block; font-size: 24px; }
.seg button.on { background: var(--butter); }
.tierdesc { font-size: 14px; color: var(--ink2); min-height: 1.4em; margin: 4px 0 0; }
.field { width: 100%; border: var(--line); border-radius: 14px; padding: 10px 12px; background: var(--butter-l); outline: none; }
textarea.field { font-size: 13px; height: 80px; resize: none; word-break: break-all; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.stat { background: var(--lilac-l); border-radius: 14px; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; }
.stat b { display: block; font-size: 22px; }
.skill { margin: 8px 0; font-size: 15px; line-height: 1.4; }
.linkbtn { background: none; border: 0; text-decoration: underline; font-weight: 600; font-size: 15px; color: var(--ink2); cursor: pointer; padding: 8px; }

@media (max-height: 640px) {
  .hub-logo .logo { font-size: 28px; }
  .nav .btn { min-height: 58px; } .nav .btn .em { font-size: 22px; }
  .story-card { padding: 7px 10px; margin-top: 8px; } .story-card .book { font-size: 26px; }
  .order .fan { font-size: 24px; } .order .want { width: 40px; height: 40px; font-size: 19px; }
  .pad { height: 70px; font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .deco { display: none; }
}
.candy.shake, .order.shake, .pad.shake { animation: shake .42s !important; }
.clue.wrong { background: #FFE0E0; }
.dstage { display: flex; align-items: flex-end; justify-content: center; min-height: 170px; margin: 6px 12px 0; }
.prog .gone .ico, .hearts .gone { opacity: .22; filter: grayscale(1); }
.chcard { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); background: #fff; border: var(--line); border-radius: 26px; box-shadow: 0 6px 0 var(--ink); padding: 16px 26px 18px; text-align: center; animation: cardIn .5s cubic-bezier(.2,1.5,.45,1); width: max-content; max-width: 86%; z-index: 6; }
.chcard small { display: block; font-weight: 700; font-size: 16px; color: var(--ink2); }
.chcard h2 { margin: 4px 0 0; font-size: clamp(26px, 8vw, 36px); line-height: 1.1; }
@keyframes cardIn { from { transform: translate(-50%, -50%) scale(.5) rotate(-6deg); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.dtext.q { font-size: 16px; min-height: 0; color: var(--ink2); }
.style-top { min-height: 0; }
.pool { cursor: pointer; }
/* fixes after first visual review */
.scast { z-index: 1; }
.dbox { z-index: 2; }
.marquee { position: absolute; top: 10px; left: 0; right: 0; text-align: center; z-index: 1; pointer-events: none; }
.marquee .logo { font-size: clamp(30px, 9.6vw, 42px); }
.stage-say { top: 64px; }
.t-crew { height: min(44vh, 360px); }
/* palette: always one row (6 faces + eraser fit on a 360px phone) */
.palette { flex-wrap: nowrap; gap: 6px; }
.palette button { width: min(54px, calc((100vw - 56px) / 7)); height: min(54px, calc((100vw - 56px) / 7)); flex: none; }
/* clue list: fade at the bottom while more clues are hidden below */
.clues.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 34px), transparent); mask-image: linear-gradient(#000 calc(100% - 34px), transparent); }
.morehint { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink2); height: 0; overflow: visible; position: relative; top: -22px; pointer-events: none; opacity: 0; transition: opacity .2s; }
.morehint.on { opacity: 1; }
@media (max-height: 720px) {
  .clue { font-size: 15px; line-height: 1.35; padding: 6px 8px; margin-bottom: 6px; }
  .pool { min-height: 70px; }
  .lstage { padding: 10px 8px 18px; }
  .lfoot { padding: 4px 12px 10px; }
}

  'Snacks! I ate 7 acorn cookies. Plus 3 more makes 10!': ['Snacks! Ich habe 7 Eichelkekse gegessen. Plus 3 dazu macht 10!', 'Nasi! Megettem 7 makkos kekszet. Meg még 3-at, az 10!'],
  'Dance Practice is now open. Practice anytime to earn more {fandom}!': ['Das Tanztraining ist jetzt offen. Übe jederzeit, um mehr {fandom} zu bekommen!', 'Megnyílt a Táncpróba. Gyakorolj bármikor, és egyre több {fandom} szurkol majd nektek!'],

  // --- story: chapter 3 ---
  'Bao\'s beat': ['Baos Beat', 'Bao ritmusa'],
  'Do you hear that? Boom-tss, boom-boom-tss!': ['Hörst du das? Bumm-tss, bumm-bumm-tss!', 'Hallod ezt? Bumm-tss, bumm-bumm-tss!'],
  'Oh, hi! I\'m Bao. I play drums on buckets... and I REALLY love dumplings.': ['Oh, hallo! Ich bin Bao. Ich trommle auf Eimern ... und ich liebe Teigtaschen WIRKLICH sehr.', 'Ó, szia! Bao vagyok. Vödrökön dobolok... és NAGYON szeretem a gombócot.'],
  'Music is made of patterns. Boom, tss, boom, tss... what comes next?': ['Musik besteht aus Mustern. Bumm, tss, bumm, tss ... was kommt als Nächstes?', 'A zene mintákból áll. Bumm, tss, bumm, tss... mi jön ezután?'],
  'Boom! That was easy!': ['Bumm! Das war leicht!', 'Bumm! Ez könnyű volt!'],
  'Hehe. My patterns get trickier. Can your producer solve my Pattern Parade?': ['Hehe. Meine Muster werden kniffliger. Schafft eure Produzentin meine Muster-Parade?', 'Hehe. A mintáim egyre trükkösebbek. Vajon {name} megoldja a Mintaparádémat?'],
  'You cracked the patterns! Could I be the drummer for Twinkle Tails?': ['Du hast die Muster geknackt! Darf ich bei Twinkle Tails Schlagzeug spielen?', 'Megfejtetted a mintákat! Lehetnék én a Twinkle Tails dobosa?'],
  '🥁 Yes! Our songs need a beat!': ['🥁 Ja! Unsere Songs brauchen einen Beat!', '🥁 Igen! A dalainkhoz ritmus kell!'],
  'Boom-tss! Best day ever!': ['Bumm-tss! Der beste Tag überhaupt!', 'Bumm-tss! Ez a legjobb nap!'],
  '🥟 Yes! And please bring dumplings!': ['🥟 Ja! Und bring bitte Teigtaschen mit!', '🥟 Igen! És hozz gombócot is!'],
  'Dumplings for everyone! Boom-tss!': ['Teigtaschen für alle! Bumm-tss!', 'Gombóc mindenkinek! Bumm-tss!'],
  'Pattern Parade is now open in the Practice room!': ['Die Muster-Parade ist jetzt im Übungsraum offen!', 'A Mintaparádé megnyílt a Gyakorlóteremben!'],

  // --- story: chapter 4 ---
  'Picture perfect': ['Bildschön', 'Tökéletes kép'],
  'Hold it right there... say cheese!': ['Bleib genau so ... bitte lächeln!', 'Maradj így... csííz!'],
  'I\'m Maple, the academy photographer. I heard Twinkle Tails needs photos for their first album!': ['Ich bin Maple, die Fotografin der Akademie. Ich habe gehört, Twinkle Tails braucht Fotos für das erste Album!', 'Maple vagyok, az akadémia fotósa. Úgy hallottam, a Twinkle Tails első albumához fotók kellenek!'],
  'Our very first album? Eeee!': ['Unser allererstes Album? Iiiih!', 'A legelső albumunk? Íííí!'],
  'My photo grids have one rule: in every row, every column and every box, each friend appears only once.': ['Für meine Fotoraster gibt es eine Regel: In jeder Reihe, jeder Spalte und jeder Box kommt jeder Freund nur einmal vor.', 'A fotórácsomnak egy szabálya van: minden sorban, minden oszlopban és minden dobozban mindenki csak egyszer szerepelhet.'],
  'It\'s like a puzzle. Tap a square, then pick who goes there. Ready, {name}?': ['Es ist wie ein Rätsel. Tippe auf ein Feld und wähle, wer dort hinkommt. Bereit, {name}?', 'Olyan, mint egy rejtvény. Koppints egy négyzetre, aztán válaszd ki, ki kerül oda. Mehet, {name}?'],
  'Picture perfect! You have a great eye, producer.': ['Bildschön! Du hast ein tolles Auge, Produzentin.', 'Tökéletes kép! Jó szemed van, producer.'],
  'Um... could I be in the photos too? I can sing AND pose!': ['Ähm ... darf ich auch mit auf die Fotos? Ich kann singen UND posieren!', 'Ööö... én is rajta lehetnék a képeken? Tudok énekelni ÉS pózolni is!'],
  '📸 Of course! Welcome, Maple!': ['📸 Na klar! Willkommen, Maple!', '📸 Hát persze! Üdv köztünk, Maple!'],
  'Yay! I\'ll take the best group selfies ever.': ['Juhu! Ich mache die besten Gruppen-Selfies aller Zeiten.', 'Juhú! Én készítem majd a világ legjobb csoportszelfijeit.'],
  '🦊 Only if you teach us your best pose!': ['🦊 Nur wenn du uns deine beste Pose beibringst!', '🦊 Csak ha megtanítod nekünk a legjobb pózodat!'],
  'Deal! Chin up, paws out, big smile!': ['Abgemacht! Kinn hoch, Pfoten raus, breit lächeln!', 'Áll az alku! Fel a fejjel, mancsot ki, nagy mosoly!'],
  'Photo Shoot puzzles are now open!': ['Die Fotoshooting-Rätsel sind jetzt offen!', 'Megnyíltak a Fotózás rejtvényei!'],

  // --- story: chapter 5 ---
  'The secret song': ['Das geheime Lied', 'A titkos dal'],
  'Everyone, look! Someone left a letter on the piano.': ['Schaut mal alle! Jemand hat einen Brief auf dem Klavier gelassen.', 'Nézzétek! Valaki levelet hagyott a zongorán.'],
  'It says: "I wrote a song for Twinkle Tails. Solve my clues and you will find me. From, M."': ['Da steht: „Ich habe ein Lied für Twinkle Tails geschrieben. Löst meine Hinweise, dann findet ihr mich. Von M.“', 'Ez áll benne: „Írtam egy dalt a Twinkle Tailsnek. Fejtsétek meg a nyomaimat, és megtaláltok. Üdv: M.”'],
  'A mystery! I love mysteries. And dumplings.': ['Ein Rätsel! Ich liebe Rätsel. Und Teigtaschen.', 'Egy rejtély! Imádom a rejtélyeket. És a gombócot.'],
  'The clues tell us where everyone should stand on stage. Let\'s read them carefully!': ['Die Hinweise verraten, wo jeder auf der Bühne stehen soll. Lesen wir sie ganz genau!', 'A nyomok elárulják, ki hol álljon a színpadon. Olvassuk el őket figyelmesen!'],
  'You solved it! Hi... I\'m Miso. I write songs, but I was too shy to say hello.': ['Du hast es gelöst! Hallo ... ich bin Miso. Ich schreibe Lieder, aber ich war zu schüchtern, um Hallo zu sagen.', 'Megfejtetted! Szia... Miso vagyok. Dalokat írok, de túl félénk voltam, hogy köszönjek.'],
  'I get nervous too, Miso. Friends make it easier.': ['Ich bin auch oft aufgeregt, Miso. Mit Freunden wird es leichter.', 'Én is szoktam izgulni, Miso. Barátokkal könnyebb.'],
  '🎵 Your song is amazing! Join us!': ['🎵 Dein Lied ist großartig! Mach bei uns mit!', '🎵 Csodás a dalod! Csatlakozz hozzánk!'],
  'Really? Then I\'ll be the maknae, the youngest member!': ['Wirklich? Dann bin ich Maknae, das jüngste Mitglied!', 'Tényleg? Akkor én leszek a maknae, a legfiatalabb tag!'],
  '🤝 Being shy is okay. We\'ll go slowly together.': ['🤝 Schüchtern sein ist okay. Wir gehen es zusammen langsam an.', '🤝 Nem baj, ha félénk vagy. Szép lassan haladunk, együtt.'],
  'Thank you... I think I\'m ready to be brave.': ['Danke ... ich glaube, ich bin bereit, mutig zu sein.', 'Köszönöm... azt hiszem, most már merek bátor lenni.'],
  'Stage Clues are now open! Twinkle Tails has six members now!': ['Die Bühnen-Rätsel sind jetzt offen! Twinkle Tails hat jetzt sechs Mitglieder!', 'Megnyílt a Színpadi rejtvény! A Twinkle Tailsnek már hat tagja van!'],

  // --- story: chapter 6 ---
  'Debut day!': ['Der Debüt-Tag!', 'A debüt napja!'],
  'Producer {name}... it\'s time. Twinkle Tails will debut on the Music Star Show tonight!': ['Produzentin {name} ... es ist so weit. Twinkle Tails debütiert heute Abend in der Music Star Show!', '{name} producer... eljött az idő. A Twinkle Tails ma este debütál a Music Star Show-ban!'],
  'Our debut? My ears are shaking!': ['Unser Debüt? Meine Ohren zittern!', 'A debütünk? Remeg a fülem!'],
  '{name}, what should I do when I feel nervous?': ['{name}, was soll ich tun, wenn ich aufgeregt bin?', '{name}, mit csináljak, ha izgulok?'],
  '🌬️ Take three slow, deep breaths': ['🌬️ Atme dreimal langsam und tief', '🌬️ Vegyél három lassú, mély levegőt'],
  'In... and out... In... and out... I feel calmer already.': ['Ein ... und aus ... Ein ... und aus ... Ich bin schon ruhiger.', 'Be... és ki... Be... és ki... Máris nyugodtabb vagyok.'],
  '💪 Remember how much you practiced': ['💪 Denk daran, wie viel du geübt hast', '💪 Gondolj arra, mennyit gyakoroltál'],
  'You\'re right. We practiced so much. We\'re ready!': ['Du hast recht. Wir haben so viel geübt. Wir sind bereit!', 'Igazad van. Rengeteget gyakoroltunk. Készen állunk!'],
  '💞 Hold hands with your friends': ['💞 Halte die Hände deiner Freunde', '💞 Fogd meg a barátaid kezét'],
  'With my friends next to me, I can do anything!': ['Mit meinen Freunden an meiner Seite schaffe ich alles!', 'Ha mellettem vannak a barátaim, bármire képes vagyok!'],
  'Our debut dance has lots of moves. Producer, lead one last practice!': ['Unser Debüt-Tanz hat viele Moves. Produzentin, leite ein letztes Training!', 'A debüttáncunkban sok a mozdulat. Producer, vezess le még egy utolsó próbát!'],
  'Ladies and gentlemen... please welcome... Twinkle Tails!': ['Meine Damen und Herren ... begrüßen Sie mit mir ... Twinkle Tails!', 'Hölgyeim és uraim... fogadják szeretettel... a Twinkle Tails!'],
  'Boom-tss! The {fandom} are cheering so loud!': ['Bumm-tss! Die {fandom} jubeln so laut!', 'Bumm-tss! A {fandom} nagyon hangosan szurkol!'],
  'They\'re singing along to my song...': ['Sie singen mein Lied mit ...', 'Velünk együtt éneklik a dalomat...'],
  'Congratulations! Twinkle Tails won the Rookie Star award!': ['Glückwunsch! Twinkle Tails hat den Rookie-Star-Preis gewonnen!', 'Gratulálok! A Twinkle Tails megnyerte a Rookie Star díjat!'],
  'Thank you, {name}. We couldn\'t have done it without you!': ['Danke, {name}. Ohne dich hätten wir das nie geschafft!', 'Köszönjük, {name}. Nélküled nem sikerült volna!'],

  // --- story: chapter 7 ---
  'The dream concert': ['Das Traumkonzert', 'Az álomkoncert'],
  'The {fandom} want MORE! Twinkle Tails is invited to the Dream Concert under the stars!': ['Die {fandom} wollen MEHR! Twinkle Tails ist zum Traumkonzert unter den Sternen eingeladen!', 'A {fandom} még TÖBBET akar! A Twinkle Tails meghívást kapott az Álomkoncertre a csillagok alatt!'],
  'The biggest stage ever! And our fans ordered a GIANT pile of candy.': ['Die größte Bühne überhaupt! Und unsere Fans haben einen RIESIGEN Berg Bonbons bestellt.', 'A valaha volt legnagyobb színpad! És a rajongóink egy ÓRIÁSI halom cukorkát rendeltek.'],
  'Let\'s make every order perfect. Producer, you lead!': ['Machen wir jeden Wunsch perfekt. Produzentin, du führst!', 'Legyen minden rendelés tökéletes. Producer, te vezetsz!'],
  'Look at all the lightsticks! It\'s like a sea of stars!': ['Schau dir all die Lightsticks an! Wie ein Meer aus Sternen!', 'Nézd azt a sok világítópálcát! Olyan, mint egy csillagtenger!'],
  'I wrote one more song. It\'s called "{name}, our star."': ['Ich habe noch ein Lied geschrieben. Es heißt „{name}, unser Stern“.', 'Írtam még egy dalt. Az a címe: „{name}, a mi csillagunk”.'],
  'Producer {name}, you made smart choices, solved tricky puzzles and never gave up.': ['Produzentin {name}, du hast klug entschieden, knifflige Rätsel gelöst und nie aufgegeben.', '{name} producer, okosan döntöttél, trükkös feladványokat oldottál meg, és soha nem adtad fel.'],
  'Twinkle Tails is a real superstar group now. I\'m so proud of you!': ['Twinkle Tails ist jetzt eine echte Superstar-Gruppe. Ich bin so stolz auf dich!', 'A Twinkle Tails mostanra igazi szupersztár csapat. Nagyon büszke vagyok rád!'],
  'This isn\'t the end. It\'s our encore! Let\'s keep practicing together!': ['Das ist nicht das Ende. Das ist unsere Zugabe! Lass uns zusammen weiterüben!', 'Ez még nem a vége. Ez a ráadás! Gyakoroljunk tovább együtt!'],

  'Two ×2 stars can\'t mix. Put one on a number candy!': ['Zwei ×2-Sterne passen nicht zusammen. Leg einen auf ein Zahlen-Bonbon!', 'Két ×2 csillag nem olvad össze. Tedd az egyiket egy számos cukorkára!'],

  '{v} is too small. {fan} needs {n} more.': ['{v} ist zu klein. {fan} braucht noch {n} mehr.', '{v}: ez túl kevés. Még {n} hiányzik, hogy {fan} örüljön.'],

  'A magic ×2 star! Drop it on a candy to double it.': ['Ein magischer ×2-Stern! Leg ihn auf ein Bonbon, um es zu verdoppeln.', 'Varázslatos ×2 csillag! Ejtsd egy cukorkára, hogy megduplázd.'],
  'Out of moves! But you can still give away matching candy.': ['Keine Züge mehr! Aber passende Bonbons kannst du noch verschenken.', 'Elfogytak a lépések! De a megfelelő cukorkákat még odaadhatod.'],
  'No hints left this round. You can do it!': ['Keine Tipps mehr in dieser Runde. Du schaffst das!', 'Ebben a körben nincs több súgó. Menni fog!'],

let S = defaultState();

function sanitizeState(d) {
  const base = defaultState();
  if (!d || typeof d !== 'object') return base;
  const out = Object.assign(base, d);
  out.level = Object.assign(defaultState().level, d.level && typeof d.level === 'object' ? d.level : {});
  out.stats = Object.assign(defaultState().stats, d.stats && typeof d.stats === 'object' ? d.stats : {});
  ['members', 'games', 'cards', 'accs', 'stages'].forEach(k => { if (!Array.isArray(out[k])) out[k] = defaultState()[k]; });
  ['wear', 'flags', 'tut', 'seen'].forEach(k => { if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {}; });
  ['hearts', 'fans', 'chapter', 'chapterStep', 'tier'].forEach(k => { out[k] = Math.max(0, Math.round(Number(out[k]) || 0)); });
  Object.keys(out.stats).forEach(k => { out.stats[k] = Math.max(0, Number(out.stats[k]) || 0); });
  out.tier = clamp(out.tier, 0, 2);
  Object.keys(out.level).forEach(k => { out.level[k] = Math.max(1, Math.round(Number(out.level[k]) || 1)); });
  out.members = out.members.filter((m, i, a) => MEMBERS[m] && a.indexOf(m) === i);
  ['hazel', 'lulu'].forEach(m => { if (out.members.indexOf(m) < 0) out.members.unshift(m); });
  out.games = out.games.filter((g, i, a) => GAMES[g] && a.indexOf(g) === i);
  if (out.accs.indexOf('none') < 0) out.accs.unshift('none');
  if (out.stages.indexOf('dream') < 0) out.stages.unshift('dream');
  if (['pastel', 'candy', 'starry'].indexOf(out.concept) < 0) out.concept = 'pastel';
  if (!STAGES.some(s => s.id === out.stage) || out.stages.indexOf(out.stage) < 0) out.stage = 'dream';
  out.name = String(out.name || '').slice(0, 14);
  out.fandom = String(out.fandom || 'Twinklers').slice(0, 14);
  out.sfx = out.sfx !== false; out.music = out.music !== false;
  if (LANG_IDS.indexOf(out.lang) < 0) out.lang = detectLang();
  out.started = !!out.started; out.finished = !!out.finished;
  return out;
}

const Store = {
  ok: false, key: 'twinkleTails.save.v1', timer: null,
  load() {

      const raw = window.localStorage.getItem(this.key);

    } catch (e) { this.ok = false; }

    clearTimeout(this.timer);
    if (!this.ok) return;
    try { window.localStorage.setItem(this.key, JSON.stringify(S)); } catch (e) { /* storage full or blocked */ }
  },
  saveSoon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 300); },
  exportCode() {
    try { return 'TT1-' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ''; }
  },
  importCode(code) {
    try {
      let c = String(code || '').trim().replace(/\s+/g, '');
      if (c.indexOf('TT1-') === 0) c = c.slice(4);
      const d = JSON.parse(decodeURIComponent(escape(atob(c))));
      if (!d || typeof d !== 'object' || !('hearts' in d) || !('level' in d)) return false;
      const keep = S.lang;
      S = sanitizeState(d);
      if (LANG_IDS.indexOf(d.lang) < 0) S.lang = keep;
      document.documentElement.lang = S.lang;
      this.save();
      return true;
    } catch (e) { return false; }
  },
  reset() {
    const keep = S.lang;
    S = defaultState(); S.lang = keep;
    try { window.localStorage.removeItem(this.key); } catch (e) { /* ignore */ }
  }
};

/* ===================== AUDIO: everything synthesized with Web Audio ===================== */
const midi = m => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ctx: null, master: null, sfxBus: null, musBus: null, noiseBuf: null, primed: false,
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.55; this.sfxBus.connect(this.master);
      this.musBus = this.ctx.createGain(); this.musBus.gain.value = 0; this.musBus.connect(this.master);
      const len = Math.floor(this.ctx.sampleRate * 0.5);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      return true;
    } catch (e) { this.ctx = null; return false; }
  },
  unlock() {
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') { try { const p = this.ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
    if (!this.primed) {
      try {
        const b = this.ctx.createBuffer(1, 1, 22050); const s = this.ctx.createBufferSource();
        s.buffer = b; s.connect(this.ctx.destination); s.start(0); this.primed = true;
      } catch (e) { /* ignore */ }
    }
  },
  ready() { return !!this.ctx && this.ctx.state === 'running'; },
  note(freq, t, dur, o) {
    o = o || {};
    const ctx = this.ctx;
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.filter; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || this.sfxBus);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(t, dur, o) {
    o = o || {};
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = o.ftype || 'highpass'; f.frequency.value = o.freq || 6000;
    const g = ctx.createGain(); const v = o.vol == null ? 0.1 : o.vol;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfxBus);
    src.start(t); src.stop(t + dur + 0.02);
  },
  play(name, arg) {
    if (!S.sfx || !this.ready()) return;
    try { this._play(name, arg, this.ctx.currentTime + 0.01); } catch (e) { /* never let sound break the game */ }
  },
  _play(name, arg, t) {
    const n = (m, dt, dur, o) => this.note(midi(m), t + dt, dur, o);
    switch (name) {
      case 'tap': this.note(680, t, 0.07, { type: 'triangle', vol: 0.12, slide: 980 }); break;
      case 'pick': this.note(520, t, 0.07, { type: 'sine', vol: 0.14, slide: 760 }); break;
      case 'open': this.note(560, t, 0.1, { type: 'sine', vol: 0.1, slide: 900 }); break;
      case 'place': n(79, 0, 0.1, { type: 'triangle', vol: 0.15 }); n(86, 0.04, 0.1, { type: 'sine', vol: 0.06 }); break;
      case 'merge': {
        const b = 60 + ((arg || 1) % 12);
        n(b + 12, 0, 0.1, { type: 'sine', vol: 0.22 }); n(b + 19, 0.07, 0.16, { type: 'triangle', vol: 0.18 }); break;
      }
      case 'spawn': n(84, 0, 0.08, { type: 'sine', vol: 0.14 }); n(91, 0.05, 0.12, { type: 'sine', vol: 0.12 }); break;
      case 'deliver': [84, 88, 91, 96].forEach((m, i) => n(m, i * 0.055, 0.2, { type: 'triangle', vol: 0.15 })); break;
      case 'ding': n(88, 0, 0.18, { type: 'triangle', vol: 0.16 }); n(95, 0.08, 0.28, { type: 'sine', vol: 0.12 }); break;
      case 'coin': this.note(988, t, 0.08, { type: 'square', vol: 0.06, filter: 3500 }); this.note(1319, t + 0.07, 0.24, { type: 'square', vol: 0.06, filter: 3500 }); break;
      case 'error': this.note(330, t, 0.13, { type: 'triangle', vol: 0.2, slide: 300 }); this.note(262, t + 0.13, 0.2, { type: 'triangle', vol: 0.2, slide: 235 }); break;
      case 'star': { const m = [84, 88, 91][arg || 0]; n(m, 0, 0.6, { type: 'sine', vol: 0.22 }); n(m + 12, 0, 0.35, { type: 'sine', vol: 0.06 }); break; }
      case 'win': [72, 76, 79, 84].forEach((m, i) => n(m, i * 0.1, 0.24, { type: 'triangle', vol: 0.17 }));
        [72, 76, 79, 84].forEach(m => n(m, 0.45, 0.7, { type: 'sine', vol: 0.08 })); break;
      case 'lose': [67, 64, 60].forEach((m, i) => n(m, i * 0.17, 0.3, { type: 'triangle', vol: 0.15 })); break;
      case 'fanfare': [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36], [79, 0.52], [84, 0.64], [88, 0.8]].forEach(p => n(p[0], p[1], p[0] === 88 ? 0.7 : 0.18, { type: 'triangle', vol: 0.16 }));
        [76, 79, 84].forEach(m => n(m, 0.8, 0.8, { type: 'sine', vol: 0.06 })); break;
      case 'pad': { const m = [72, 76, 79, 84][arg || 0]; n(m, 0, 0.42, { type: 'triangle', vol: 0.24 }); n(m + 12, 0, 0.28, { type: 'sine', vol: 0.07 }); break; }
      case 'blip': this.note((arg || 600) * (0.9 + Math.random() * 0.2), t, 0.045, { type: 'square', vol: 0.035, filter: 2200 }); break;
      case 'whoosh': this.noise(t, 0.28, { ftype: 'bandpass', freq: 1400, vol: 0.09 }); break;
      case 'camera': this.noise(t, 0.08, { freq: 2500, vol: 0.2 }); this.noise(t + 0.1, 0.12, { freq: 4000, vol: 0.12 }); break;
      case 'drum':
        this.note(150, t, 0.22, { type: 'sine', vol: 0.5, slide: 45 }); this.noise(t + 0.26, 0.09, { freq: 7000, vol: 0.14 });
        this.note(150, t + 0.52, 0.22, { type: 'sine', vol: 0.5, slide: 45 }); this.noise(t + 0.78, 0.09, { freq: 7000, vol: 0.14 }); break;
      case 'sparkle': shuffle([88, 91, 93, 96, 100]).forEach((m, i) => n(m, i * 0.045, 0.14, { type: 'sine', vol: 0.08 })); break;
      case 'buy': this._play('coin', 0, t); [91, 96].forEach((m, i) => n(m, 0.2 + i * 0.07, 0.2, { type: 'sine', vol: 0.09 })); break;
      default: break;
    }
  }
};

/* A little looping bubblegum-pop song: C  G  Am F  C  G  F  G */
const Music = {
  on: false, mode: 'full', step: 0, next: 0, timer: null, bpm: 112,
  MEL: [76, 79, 81, 79, 76, 0, 72, 74, 74, 0, 71, 74, 79, 0, 74, 0, 72, 76, 81, 0, 79, 76, 72, 0, 69, 72, 77, 0, 76, 0, 74, 0,
    76, 79, 84, 0, 83, 0, 79, 81, 79, 0, 74, 0, 71, 74, 79, 0, 81, 0, 79, 77, 76, 0, 74, 72, 74, 0, 76, 0, 79, 0, 0, 0],
  ROOT: [60, 55, 57, 53, 60, 55, 53, 55],
  CH: [[60, 64, 67], [59, 62, 67], [60, 64, 69], [60, 65, 69], [60, 64, 67], [59, 62, 67], [60, 65, 69], [59, 62, 67]],
  start(mode) {
    if (mode) this.mode = mode;
    if (!S.music || !Sound.ctx) return;
    this.fade(this.mode === 'calm' ? 0.09 : 0.15, 0.6);
    if (this.on) return;
    this.on = true; this.step = 0; this.next = Sound.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop() {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer); this.timer = null;
    this.fade(0, 0.3);
  },
  fade(v, time) {
    if (!Sound.musBus) return;
    try {
      const g = Sound.musBus.gain, t = Sound.ctx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + time);
    } catch (e) { /* ignore */ }
  },
  tick() {
    const ctx = Sound.ctx;
    if (!ctx || !this.on) return;
    const sp = 60 / this.bpm / 2;
    if (this.next < ctx.currentTime - 0.5) this.next = ctx.currentTime + 0.05; // resync after a pause

/* ===================== FX: particles on a canvas overlay ===================== */

  rain(n) {

      this.parts.push({
        x: Math.random() * this.w, y: -20 - Math.random() * this.h * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, g: 0.03,
        life: 0, max: 170 + Math.random() * 90, size: 7 + Math.random() * 6, color: pick(this.COLORS),
        kind: pick(['confetti', 'confetti', 'heart', 'star']), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, sway: 1 + Math.random() * 6

/* ===================== LOGIC: pure puzzle generators (no DOM) ===================== */
const DOUBLE = -2; // the magic ×2 candy
const Logic = {};

/* ---------- Candy Orders ---------- */
Logic.mergeParams = function (tier, level) {
  const L = Math.min(Math.max(level, 1) - 1, 15);
  const base = [
    { cols: 4, rows: 4, spawnMax: 4, tMin: 3, tMax: 8, orders: 3, show: 2, start: 7, dbl: false },
    { cols: 4, rows: 5, spawnMax: 6, tMin: 6, tMax: 14, orders: 4, show: 3, start: 9, dbl: false },
    { cols: 4, rows: 5, spawnMax: 9, tMin: 10, tMax: 24, orders: 5, show: 3, start: 10, dbl: true }
  ][tier];
  const p = Object.assign({}, base);
  p.tMax = Math.min([10, 20, 40][tier], p.tMax + Math.floor(L / 2) * (tier + 1));
  p.tMin = Math.min(p.tMin + Math.floor(L / 3), p.tMax - 3);
  p.orders += Math.min(2, Math.floor(L / 3));
  p.moves = Logic.mergeMoves(p);
  return p;
};
Logic.mergeMoves = function (p) {
  // fitted to a greedy test player (see tests): kids get roughly twice what that player needs
  const avgSpawn = (1 + p.spawnMax) / 2, avgT = (p.tMin + p.tMax) / 2;
  const par = Math.max(2, p.orders * (2 * avgT / avgSpawn - 1) - p.start);
  return Math.max(14, Math.ceil(par * 1.6 + 6));
};
Logic.mergeStars = (left, total) => (left >= total * 0.4 ? 3 : left >= total * 0.2 ? 2 : 1);
Logic.newTarget = function (p, existing) {
  let t, tries = 0;
  do { t = rand(p.tMin, p.tMax); tries++; } while (existing.indexOf(t) >= 0 && tries < 30);
  return t;
};
Logic.startCandies = function (p, firstTarget) {
  const vals = [];
  const a = rand(1, Math.min(p.spawnMax, Math.max(1, firstTarget - 1)));
  const b = firstTarget - a;
  vals.push(a);
  if (b >= 1 && b <= p.spawnMax) vals.push(b);
  while (vals.length < p.start) vals.push(rand(1, p.spawnMax));
  return shuffle(vals);
};
Logic.spawnValue = function (p, nums, targets) {
  if (Math.random() < 0.5 && targets.length) {
    const opts = [];
    targets.forEach(T => {
      if (T <= p.spawnMax) opts.push(T);
      nums.forEach(c => { const r = T - c; if (r >= 1 && r <= p.spawnMax) opts.push(r); });
    });
    if (opts.length) return pick(opts);
  }
  return rand(1, p.spawnMax);
};
/* cells: values (null = empty, DOUBLE = ×2). returns a suggestion object */
Logic.mergeHint = function (cells, targets, p) {
  const idx = [];
  cells.forEach((v, i) => { if (v != null) idx.push(i); });
  for (const i of idx) if (cells[i] > 0 && targets.indexOf(cells[i]) >= 0) return { type: 'deliver', i };
  for (let x = 0; x < idx.length; x++) for (let y = x + 1; y < idx.length; y++) {
    const a = cells[idx[x]], b = cells[idx[y]];
    if (a > 0 && b > 0 && targets.indexOf(a + b) >= 0) return { type: 'merge', i: idx[x], j: idx[y] };
  }
  const d = idx.find(i => cells[i] === DOUBLE);
  if (d != null) for (const i of idx) if (cells[i] > 0 && targets.indexOf(cells[i] * 2) >= 0) return { type: 'merge', i: d, j: i };
  for (let x = 0; x < idx.length; x++) for (let y = x + 1; y < idx.length; y++) for (let z = y + 1; z < idx.length; z++) {
    const a = cells[idx[x]], b = cells[idx[y]], c = cells[idx[z]];
    if (a > 0 && b > 0 && c > 0 && targets.indexOf(a + b + c) >= 0) return { type: 'merge', i: idx[x], j: idx[y] };
  }
  // almost there: a merge that leaves a small gap we can fill with one new candy
  let best = null;
  for (let x = 0; x < idx.length; x++) for (let y = x + 1; y < idx.length; y++) {
    const a = cells[idx[x]], b = cells[idx[y]];
    if (a <= 0 || b <= 0) continue;
    targets.forEach(T => {
      const r = T - (a + b);
      if (r >= 1 && r <= p.spawnMax && (!best || a + b > best.s)) best = { type: 'merge', i: idx[x], j: idx[y], s: a + b };
    });
  }
  if (best) return best;
  const hasEmpty = cells.some(v => v == null);
  // building up: combine two candies into something bigger that still fits under a target
  const maxT = Math.max.apply(null, targets);
  let build = null;
  for (let x = 0; x < idx.length; x++) for (let y = x + 1; y < idx.length; y++) {
    const a = cells[idx[x]], b = cells[idx[y]];
    let s = -1, i = idx[x], j = idx[y];
    if (a > 0 && b > 0) s = a + b;
    else if (a === DOUBLE && b > 0) s = b * 2;
    else if (b === DOUBLE && a > 0) { s = a * 2; i = idx[y]; j = idx[x]; }
    if (s > 0 && s < maxT && (!build || s > build.s)) build = { type: 'merge', i, j, s };
  }
  const nCandies = idx.length;
  if (build && (!hasEmpty || nCandies >= 3)) return build;
  if (hasEmpty) return { type: 'spawn' };
  if (build) return build;
  let big = -1;
  idx.forEach(i => { if (cells[i] > maxT && (big < 0 || cells[i] > cells[big])) big = i; });
  if (big < 0) big = idx.reduce((m, i) => (cells[i] > cells[m] ? i : m), idx[0]);
  return { type: 'recycle', i: big };
};

/* ---------- Dance Practice ---------- */
Logic.danceParams = function (tier, level) {
  const L = Math.max(level, 1) - 1;
  const mirror = tier === 2 && level % 3 === 0;
  let target = [Math.min(8, 4 + Math.floor(L / 2)), Math.min(10, 5 + Math.floor(L / 2)), Math.min(12, 6 + Math.floor(L / 2))][tier];
  if (mirror) target = Math.max(4, target - 2);
  return { target, lives: tier === 2 ? 2 : 3, speed: [720, 630, 560][tier], mirror, startLen: Math.max(1, target - 5) };
};

/* ---------- Photo Shoot (sudoku) ---------- */
Logic.sudokuParams = function (tier, level) {
  const L = Math.max(level, 1) - 1;
  if (tier === 0) return { n: 4, givens: Math.max(8, 10 - Math.floor(L / 3)) };
  if (tier === 1) return level >= 7 ? { n: 6, givens: Math.max(18, 24 - (level - 7)) } : { n: 4, givens: Math.max(5, 7 - Math.floor(L / 2)) };
  return { n: 6, givens: Math.max(13, 20 - L) };
};
Logic.boxDims = n => (n === 6 ? { br: 2, bc: 3 } : { br: 2, bc: 2 });
Logic.countSolutions = function (grid, n, br, bc, limit) {
  const g = grid.slice(); const full = (1 << n) - 1; let count = 0;
  function avail(i) {
    const r = (i / n) | 0, c = i % n; let used = 0;
    for (let k = 0; k < n; k++) {
      const a = g[r * n + k], b = g[k * n + c];
      if (a >= 0) used |= 1 << a;
      if (b >= 0) used |= 1 << b;
    }
    const r0 = r - (r % br), c0 = c - (c % bc);
    for (let y = r0; y < r0 + br; y++) for (let x = c0; x < c0 + bc; x++) { const v = g[y * n + x]; if (v >= 0) used |= 1 << v; }
    return full & ~used;
  }
  (function solve() {
    if (count >= limit) return;
    let best = -1, bestMask = 0, bestCnt = 99;
    for (let i = 0; i < n * n; i++) {
      if (g[i] >= 0) continue;
      const m = avail(i); let cnt = 0;
      for (let t = m; t; t &= t - 1) cnt++;
      if (cnt === 0) return;
      if (cnt < bestCnt) { best = i; bestMask = m; bestCnt = cnt; if (cnt === 1) break; }
    }
    if (best < 0) { count++; return; }
    for (let v = 0; v < n; v++) {
      if (bestMask & (1 << v)) { g[best] = v; solve(); g[best] = -1; if (count >= limit) return; }
    }
  })();
  return count;
};
Logic.sudoku = function (n, givens) {
  const { br, bc } = Logic.boxDims(n);
  const sym = shuffle(range(n));
  const rows = [], cols = [];
  shuffle(range(n / br)).forEach(b => shuffle(range(br)).forEach(r => rows.push(b * br + r)));
  shuffle(range(n / bc)).forEach(s => shuffle(range(bc)).forEach(c => cols.push(s * bc + c)));
  const sol = new Array(n * n);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const rr = rows[r], cc = cols[c];
    sol[r * n + c] = sym[(bc * (rr % br) + Math.floor(rr / br) + cc) % n];
  }
  const grid = sol.slice();
  let count = n * n;
  for (const i of shuffle(range(n * n))) {
    if (count <= givens) break;
    const v = grid[i]; grid[i] = -1;
    if (Logic.countSolutions(grid, n, br, bc, 2) !== 1) grid[i] = v; else count--;

};
Logic.sudokuConflicts = function (grid, n, br, bc) {
  const bad = {};
  for (let i = 0; i < n * n; i++) {
    if (grid[i] < 0) continue;
    const r = (i / n) | 0, c = i % n;
    for (let j = i + 1; j < n * n; j++) {
      if (grid[j] !== grid[i]) continue;
      const r2 = (j / n) | 0, c2 = j % n;
      if (r === r2 || c === c2 || (Math.floor(r / br) === Math.floor(r2 / br) && Math.floor(c / bc) === Math.floor(c2 / bc))) { bad[i] = 1; bad[j] = 1; }
    }

/* ---------- Stage Clues (line-up logic) ---------- */
Logic.lineupParams = function (tier, level) {
  if (tier === 0) return { k: level >= 5 ? 4 : 3 };
  if (tier === 1) return { k: level >= 6 ? 5 : 4 };
  return { k: level >= 3 ? 5 : 4 };
};
Logic.perms = function (k) {
  const res = [], a = range(k);
  (function perm(i) {
    if (i === k) { const pos = []; a.forEach((m, s) => { pos[m] = s; }); res.push(pos); return; }
    for (let j = i; j < k; j++) { let t = a[i]; a[i] = a[j]; a[j] = t; perm(i + 1); t = a[i]; a[i] = a[j]; a[j] = t; }

  const a = pos[cl.a], b = cl.b != null ? pos[cl.b] : -1, c = cl.c != null ? pos[cl.c] : -1;
  switch (cl.t) {
    case 'at': return a === cl.p;
    case 'notAt': return a !== cl.p;
    case 'left': return a < b;
    case 'right': return a > b;
    case 'justLeft': return a === b - 1;
    case 'next': return Math.abs(a - b) === 1;
    case 'notNext': return Math.abs(a - b) !== 1;
    case 'end': return a === 0 || a === k - 1;

  for (let attempt = 0; attempt < 200; attempt++) {
    const sol = perms[rand(0, perms.length - 1)];

        if (has('left') && pa < pb) pool.push({ t: 'left', a, b });
        if (has('right') && pa > pb) pool.push({ t: 'right', a, b });
        if (has('justLeft') && pa === pb - 1) pool.push({ t: 'justLeft', a, b });
        if (has('next') && a < b && Math.abs(pa - pb) === 1) pool.push({ t: 'next', a, b });
        if (has('notNext') && a < b && Math.abs(pa - pb) !== 1) pool.push({ t: 'notNext', a, b });
        if (has('between')) {
          for (let c = b + 1; c < k; c++) {
            if (c === a) continue;
            const pc = sol[c];
            if ((pa > pb && pa < pc) || (pa < pb && pa > pc)) pool.push({ t: 'between', a, b, c });
          }
        }
      }
    }
    pool.forEach(cl => {
      const w = cl.t === 'at' ? wAt : cl.t === 'notAt' ? 0.5 : cl.t === 'end' || cl.t === 'notEnd' ? 0.7 : 1;
      cl._k = Math.pow(Math.random(), 1 / w);
    });
    pool.sort((x, y) => y._k - x._k);
    let remaining = perms.slice();
    const chosen = [];
    for (const cl of pool) {
      const next = remaining.filter(pos => Logic.clueTrue(cl, pos, k));
      if (next.length < remaining.length) { chosen.push(cl); remaining = next; if (remaining.length === 1) break; }
    }
    if (remaining.length !== 1) continue;
    for (let i = chosen.length - 1; i >= 0; i--) {
      const without = chosen.filter((_, j) => j !== i);
      if (perms.filter(pos => without.every(cl => Logic.clueTrue(cl, pos, k))).length === 1) chosen.splice(i, 1);
    }
    if (chosen.length > maxClues) continue;
    if (chosen.filter(c => c.t === 'at').length > maxAt) continue;
    chosen.forEach(c => { delete c._k; });
    return { k, sol, clues: shuffle(chosen) };
  }
  // fallback (practically never used): pin everyone but one
  const sol = perms[rand(0, perms.length - 1)];
  return { k, sol, clues: range(k - 1).map(a => ({ t: 'at', a, p: sol[a] })) };
};

Logic.PICS_EMOJI = ['🍓', '🍋', '🥕', '🌰', '🍩', '⭐', '🌸', '🎀', '💎', '🍪', '🎈', '🍉'];

  fib: () => { const pr = pick([[1, 1], [1, 2], [2, 3], [1, 3], [2, 2]]); const items = pr.slice(); while (items.length < 6) items.push(items[items.length - 1] + items[items.length - 2]); return numQ(items, 5, T('Add the two numbers before:')); },
